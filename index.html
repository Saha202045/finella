<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Finella 💖</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF1F6E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finella">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose:#FF1F6E; --rose-light:#FFE0EC; --rose-glow:rgba(255,31,110,.3);
      --violet:#9B5DE5; --violet-light:#F0E8FF;
      --peach:#FF8C6B; --peach-light:#FFEDE7;
      --mint:#00D9A6; --mint-light:#CCFAF2;
      --gold:#F5A623; --gold-light:#FEF3DC;
      --sky:#4FACFE; --sky-light:#DDEFFF;
      --bg:#FEF0F6; --surface:#FFFFFF;
      --text:#1A0A2E; --muted:#9A7AB8; --light:#C4B0D8;
      --border:rgba(155,93,229,.12);
      --hero:linear-gradient(135deg,#FF1F6E 0%,#9B5DE5 60%,#FF8C6B 100%);
      --hero2:linear-gradient(135deg,#00D9A6 0%,#4FACFE 100%);
      --hero3:linear-gradient(135deg,#F5A623 0%,#FF8C6B 100%);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    h1,h2,.display{font-family:'Playfair Display',Georgia,serif}
    ::-webkit-scrollbar{display:none}
    input,select,textarea,button{font-family:inherit}

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--rose-glow)}60%{box-shadow:0 0 0 16px transparent}}
    @keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes progressIn{from{width:0}to{width:var(--w)}}
    @keyframes ringIn{from{stroke-dashoffset:var(--circ)}to{stroke-dashoffset:var(--end)}}
    @keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.15)}70%{transform:scale(.95)}}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    @keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    .fu{animation:fadeUp .42s cubic-bezier(.23,1,.32,1) both}
    .fi{animation:fadeIn .3s ease both}
    .si{animation:scaleIn .32s cubic-bezier(.23,1,.32,1) both}

    /* ─── LAYOUT ─── */
    #root{display:flex;flex-direction:column;position:relative}
    .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(86px + var(--safe-bottom));padding-top:calc(var(--safe-top) + 0px)}
    .screen.no-nav{padding-bottom:0}

    /* ─── SURFACE / CARDS ─── */
    .card{background:var(--surface);border-radius:24px;box-shadow:0 4px 24px rgba(155,93,229,.1);border:1.5px solid var(--border)}
    .glass{background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.3)}

    /* ─── BUTTONS ─── */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 28px;border-radius:18px;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s;webkitTapHighlightColor:transparent;font-family:inherit}
    .btn:active{transform:scale(.95)}
    .btn-rose{background:var(--hero);background-size:200% 200%;animation:gradShift 5s ease infinite;color:#fff;box-shadow:0 8px 28px var(--rose-glow)}
    .btn-ghost{background:rgba(155,93,229,.08);color:var(--muted);border:1.5px solid var(--border)}
    .btn-danger{background:#FFF0F0;color:#E53935;border:1.5px solid #FECDD3}
    .btn-sm{padding:9px 18px;font-size:13px;border-radius:12px}

    /* ─── INPUTS ─── */
    .inp{width:100%;padding:15px 16px;font-size:15px;font-weight:500;color:var(--text);background:#FDF5FF;border:2px solid var(--border);border-radius:16px;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;font-family:inherit}
    .inp:focus{border-color:var(--violet);background:#fff}
    .lbl{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
    .inp-wrap{margin-bottom:16px}

    /* ─── BOTTOM NAV ─── */
    .bot-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(155,93,229,.1);display:flex;align-items:stretch;padding-bottom:var(--safe-bottom);z-index:100;box-shadow:0 -4px 24px rgba(155,93,229,.1)}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 0 8px;background:none;border:none;cursor:pointer;webkitTapHighlightColor:transparent;position:relative;transition:color .2s;font-family:inherit}
    .nav-btn .nav-icon{font-size:22px;line-height:1;transition:transform .2s}
    .nav-btn .nav-label{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--light);transition:color .2s}
    .nav-btn.active .nav-label{color:var(--rose)}
    .nav-btn.active .nav-icon{transform:scale(1.15)}
    .nav-btn::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:3px;background:var(--hero);border-radius:0 0 3px 3px;transition:width .25s cubic-bezier(.23,1,.32,1)}
    .nav-btn.active::after{width:32px}

    /* ─── FAB ─── */
    .fab{position:fixed;bottom:calc(var(--safe-bottom) + 78px);right:20px;width:60px;height:60px;border-radius:50%;background:var(--hero);background-size:200% 200%;animation:gradShift 5s ease infinite,pulse 2.5s ease-in-out infinite;color:#fff;border:none;font-size:28px;cursor:pointer;z-index:101;box-shadow:0 8px 28px var(--rose-glow);webkitTapHighlightColor:transparent;display:flex;align-items:center;justify-content:center;transition:transform .15s}
    .fab:active{transform:scale(.9)}

    /* ─── MODAL ─── */
    .overlay{position:fixed;inset:0;background:rgba(26,10,46,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:200;animation:fadeIn .25s ease;display:flex;align-items:flex-end;justify-content:center}
    .sheet{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .38s cubic-bezier(.23,1,.32,1);padding-bottom:calc(24px + var(--safe-bottom))}
    .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 20px;flex-shrink:0}

    /* ─── AMOUNT DISPLAY ─── */
    .amount-positive{color:var(--mint)}
    .amount-negative{color:var(--rose)}

    /* ─── CATEGORY PILL ─── */
    .cat-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

    /* ─── SEGMENT ─── */
    .seg{display:flex;background:#F3EEF9;border-radius:14px;padding:4px;gap:4px}
    .seg-btn{flex:1;padding:9px 6px;border:none;border-radius:11px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--muted);background:transparent;white-space:nowrap}
    .seg-btn.active{background:#fff;color:var(--text);box-shadow:0 2px 10px rgba(155,93,229,.15)}

    /* ─── PROGRESS BAR ─── */
    .prog-track{background:#F0E8FF;border-radius:50px;height:8px;overflow:hidden}
    .prog-fill{height:100%;border-radius:50px;transition:width .8s cubic-bezier(.23,1,.32,1)}

    /* ─── CHIP ─── */
    .chip{padding:7px 14px;border-radius:50px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:transparent;color:var(--muted);webkitTapHighlightColor:transparent;white-space:nowrap;font-family:inherit;transition:all .2s}
    .chip.active{border-color:var(--rose);background:var(--rose-light);color:var(--rose)}

    /* ─── ONBOARDING ─── */
    .ob-bg{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--hero);background-size:200% 200%;animation:gradShift 8s ease infinite;padding:32px 24px;position:relative;overflow:hidden}
    .ob-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}

    /* ─── CHAT ─── */
    .chat-bubble{max-width:82%;padding:12px 16px;border-radius:20px;font-size:14px;font-weight:500;line-height:1.65;animation:msgIn .3s ease both}
    .bubble-ai{background:var(--surface);color:var(--text);border-radius:4px 20px 20px 20px;box-shadow:0 2px 12px rgba(155,93,229,.1);align-self:flex-start}
    .bubble-user{background:var(--hero);background-size:200% 200%;animation:gradShift 5s ease infinite,msgIn .3s ease both;color:#fff;border-radius:20px 4px 20px 20px;align-self:flex-end}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s ease-in-out infinite}
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}

    /* ─── MISC ─── */
    .tx-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;webkitTapHighlightColor:transparent;transition:opacity .15s}
    .tx-row:last-child{border-bottom:none}
    .tx-row:active{opacity:.7}
    .section-title{font-size:19px;font-weight:700;color:var(--text);margin-bottom:14px;font-family:'Playfair Display',serif}
    .p-screen{padding:20px 18px}
    .date-sep{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:14px 0 8px}

    /* Savings ring */
    .savings-ring{transform:rotate(-90deg);flex-shrink:0}
    .ring-bg{fill:none;stroke:#F0E8FF;stroke-width:6}
    .ring-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:none;animation:ringIn 1.2s cubic-bezier(.23,1,.32,1) both}

    /* Hero numbers animation */
    .hero-num{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;color:#fff;letter-spacing:-0.03em;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.15)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import{h,render,Fragment}from'https://esm.sh/preact@10.19.3';
import{useState,useEffect,useCallback,useRef,useMemo}from'https://esm.sh/preact@10.19.3/hooks';
import htm from'https://esm.sh/htm@3.1.1';
const html=htm.bind(h);

//
const CATS=[
  {k:'shopping',   l:'Shopping',     e:'🛍️', c:'#FF1F6E', bg:'#FFE0EC', g:'linear-gradient(135deg,#FF1F6E,#FF8C6B)', t:'expense'},
  {k:'courses',    l:'Courses',      e:'🛒', c:'#00B894', bg:'#CCFAF2', g:'linear-gradient(135deg,#00D9A6,#4FACFE)', t:'expense'},
  {k:'restaurant', l:'Restaurant',   e:'🍽️', c:'#FF7B54', bg:'#FFEDE7', g:'linear-gradient(135deg,#FF7B54,#FBBF24)', t:'expense'},
  {k:'logement',   l:'Logement',     e:'🏠', c:'#9B5DE5', bg:'#F0E8FF', g:'linear-gradient(135deg,#9B5DE5,#C77DFF)', t:'expense'},
  {k:'sante',      l:'Santé',        e:'💊', c:'#00C49F', bg:'#D0F7EE', g:'linear-gradient(135deg,#00C49F,#38BDF8)', t:'expense'},
  {k:'transport',  l:'Transport',    e:'🚗', c:'#4FACFE', bg:'#DDEFFF', g:'linear-gradient(135deg,#4FACFE,#818CF8)', t:'expense'},
  {k:'beaute',     l:'Beauté',       e:'💅', c:'#F472B6', bg:'#FFE0F2', g:'linear-gradient(135deg,#F472B6,#E879F9)', t:'expense'},
  {k:'loisirs',    l:'Loisirs',      e:'🎬', c:'#FBBF24', bg:'#FFF3D0', g:'linear-gradient(135deg,#FBBF24,#F97316)', t:'expense'},
  {k:'abos',       l:'Abonnements',  e:'📱', c:'#818CF8', bg:'#E8EAFF', g:'linear-gradient(135deg,#818CF8,#9B5DE5)', t:'expense'},
  {k:'voyages',    l:'Voyages',      e:'✈️', c:'#06B6D4', bg:'#CDFAFF', g:'linear-gradient(135deg,#06B6D4,#38BDF8)', t:'expense'},
  {k:'beaute2',    l:'Soins & Bien-être',e:'🧴',c:'#EC4899',bg:'#FDE8F5',g:'linear-gradient(135deg,#EC4899,#F472B6)',t:'expense'},
  {k:'sport',      l:'Sport & Fitness',e:'🏋️',c:'#10B981',bg:'#D1FAE5',g:'linear-gradient(135deg,#10B981,#34D399)',t:'expense'},
  {k:'enfants',    l:'Enfants',       e:'🧸', c:'#FCA5A5', bg:'#FEE2E2', g:'linear-gradient(135deg,#FCA5A5,#F472B6)', t:'expense'},
  {k:'autre',      l:'Autre',         e:'💸', c:'#94A3B8', bg:'#E8EDF2', g:'linear-gradient(135deg,#94A3B8,#CBD5E1)', t:'expense'},
  {k:'salaire',    l:'Salaire',       e:'💼', c:'#10B981', bg:'#D1FAE5', g:'linear-gradient(135deg,#10B981,#06B6D4)', t:'income'},
  {k:'freelance',  l:'Freelance',     e:'💻', c:'#34D399', bg:'#CCFCE7', g:'linear-gradient(135deg,#34D399,#4FACFE)', t:'income'},
  {k:'cadeau',     l:'Cadeau / Remb.',e:'🎁', c:'#F59E0B', bg:'#FEF3C7', g:'linear-gradient(135deg,#F59E0B,#FBBF24)', t:'income'},
  {k:'invest',     l:'Investissement',e:'📈', c:'#3B82F6', bg:'#DBEAFE', g:'linear-gradient(135deg,#3B82F6,#8B5CF6)', t:'income'},
];
const getC=k=>CATS.find(c=>c.k===k)||CATS[CATS.length-1];
const CURRENCIES=[{s:'€',l:'EUR'},{s:'$',l:'USD'},{s:'£',l:'GBP'},{s:'FCFA',l:'XOF'},{s:'MAD',l:'MAD'}];
const mkId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmtAmt=(n,cur='€')=>`${cur}${Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f')}`;
const fmtDate=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const dayKey=d=>new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const monthKey=d=>new Date(d).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const thisMonth=()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`};
const isThisMonth=d=>d.startsWith(thisMonth());

//
const LS={
  get:(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch{return def}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
};

//
const Loader=()=>html`<div style=${{display:'flex',alignItems:'center',justifyContent:'center',height:'100%'}}>
  <div style=${{width:44,height:44,borderRadius:'50%',border:'4px solid #F0E8FF',borderTopColor:'var(--rose)',animation:'spin .7s linear infinite'}}/>
</div>`;

const FInput=({label,value,onChange,type='text',placeholder='',prefix,min,step})=>html`
  <div class="inp-wrap">
    ${label&&html`<label class="lbl">${label}</label>`}
    <div style=${{position:'relative'}}>
      ${prefix&&html`<span style=${{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',fontSize:16,fontWeight:700,color:'var(--muted)',pointerEvents:'none'}}>${prefix}</span>`}
      <input class="inp" style=${{paddingLeft:prefix?'38px':undefined}} type=${type} value=${value} min=${min} step=${step}
        onInput=${e=>onChange(e.target.value)} placeholder=${placeholder} />
    </div>
  </div>`;

const FSelect=({label,value,onChange,options})=>html`
  <div class="inp-wrap">
    ${label&&html`<label class="lbl">${label}</label>`}
    <select class="inp" style=${{cursor:'pointer',appearance:'none',backgroundImage:`url("data:image/svg+xml,%3Csvg width='16' height='10' viewBox='0 0 16 10' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L8 9L15 1' stroke='%239A7AB8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E")`,backgroundRepeat:'no-repeat',backgroundPosition:'right 14px center',paddingRight:44}}
      value=${value} onChange=${e=>onChange(e.target.value)}>
      ${options.map(o=>html`<option value=${o.v}>${o.l}</option>`)}
    </select>
  </div>`;

const Sheet=({title,onClose,children,action,actionLabel='Enregistrer',actionGrad=true})=>html`
  <div class="overlay" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div class="sheet">
      <div class="sheet-handle"/>
      <div style=${{padding:'0 20px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid var(--border)',paddingBottom:16,marginBottom:8}}>
        <h2 style=${{fontSize:20,fontFamily:"'Playfair Display',serif",fontWeight:700,color:'var(--text)'}}>${title}</h2>
        <button onClick=${onClose} style=${{background:'rgba(155,93,229,.1)',border:'none',borderRadius:'50%',width:34,height:34,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:18,color:'var(--muted)',fontFamily:'inherit'}}>×</button>
      </div>
      <div style=${{padding:'12px 20px 0'}}>${children}</div>
      ${action&&html`<div style=${{padding:'8px 20px 0',display:'flex',gap:10}}>
        <button onClick=${onClose} class="btn btn-ghost" style=${{flex:1}}>Annuler</button>
        <button onClick=${action} class=${`btn ${actionGrad?'btn-rose':'btn-ghost'}`} style=${{flex:2}}>${actionLabel} ✓</button>
      </div>`}
    </div>
  </div>`;

//
const DonutChart=({data,size=160})=>{
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total)return html`<div style=${{width:size,height:size,borderRadius:'50%',background:'#F0E8FF',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'var(--muted)',fontWeight:600}}>Vide</div>`;
  const R=60,circ=2*Math.PI*R,strokeW=18;
  let offset=0;
  const segs=data.map(d=>{const pct=d.value/total,len=pct*circ,seg={...d,offset,pct,len};offset+=len;return seg;});
  return html`<div style=${{position:'relative',width:size,height:size}}>
    <svg width=${size} height=${size} viewBox="0 0 160 160" style=${{transform:'rotate(-90deg)'}}>
      <circle cx="80" cy="80" r=${R} fill="none" stroke="#F0E8FF" stroke-width=${strokeW}/>
      ${segs.map((s,i)=>html`<circle key=${i} cx="80" cy="80" r=${R} fill="none" stroke=${s.color}
        stroke-width=${strokeW} stroke-dasharray="${s.len} ${circ}" stroke-dashoffset=${-s.offset}
        stroke-linecap="round" style=${{transition:'stroke-dasharray .8s ease',opacity:.9}}/>`)}
    </svg>
    <div style=${{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <div style=${{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>Total</div>
      <div style=${{fontSize:17,fontWeight:800,color:'var(--text)',fontFamily:"'Playfair Display',serif"}}>${data[0]?.cur||'€'}${total.toFixed(0)}</div>
    </div>
  </div>`;
};

//
const SavingsRing=({pct,color,size=72})=>{
  const R=28,circ=2*Math.PI*R,filled=Math.min(pct,100)/100*circ;
  return html`<svg class="savings-ring" width=${size} height=${size} viewBox="0 0 72 72">
    <circle class="ring-bg" cx="36" cy="36" r=${R}/>
    <circle class="ring-fill" cx="36" cy="36" r=${R} stroke=${color}
      stroke-dasharray=${circ} stroke-dashoffset=${circ-filled}
      style=${{animationDuration:'1.2s',['--circ']:circ,['--end']:circ-filled}}/>
  </svg>`;
};

//
const CatPicker=({value,onChange,type})=>{
  const cats=CATS.filter(c=>c.t===type);
  return html`<div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
    ${cats.map(c=>html`<button key=${c.k} onClick=${()=>onChange(c.k)}
      style=${{background:value===c.k?c.g:c.bg,borderRadius:14,border:value===c.k?`2.5px solid ${c.c}`:'2.5px solid transparent',padding:'10px 4px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all .18s',boxShadow:value===c.k?`0 4px 16px ${c.c}44`:'none',WebkitTapHighlightColor:'transparent'}}>
      <span style=${{fontSize:22,lineHeight:1}}>${c.e}</span>
      <span style=${{fontSize:9,fontWeight:700,color:value===c.k?'#fff':c.c,lineHeight:1.2,textAlign:'center',letterSpacing:'.02em'}}>${c.l}</span>
    </button>`)}
  </div>`;
};

//
const TxForm=({onClose,onSave,initial})=>{
  const [type,setType]=useState(initial?.type||'expense');
  const [amount,setAmount]=useState(initial?.amount?String(initial.amount):'');
  const [cat,setCat]=useState(initial?.cat||'shopping');
  const [desc,setDesc]=useState(initial?.desc||'');

const BudgetPage=({txs,budgets,cur,onSaveBudget})=>{

  const totalSpent=Object.values(spentByCat).reduce((s,v)=>s+v,0);
  const pctTotal=totalBudget>0?Math.min(totalSpent/totalBudget*100,100):0;

  return html`<div class="p-screen">
    <h1 class="section-title" style=${{fontSize:26,marginBottom:2}}>Mon Budget 📊</h1>

        </div>
        <div style=${{fontSize:22,fontWeight:900,color:'rgba(255,255,255,.9)',fontFamily:"'Playfair Display',serif"}}>${Math.round(pctTotal)}%</div>

      <div style=${{background:'rgba(255,255,255,.2)',borderRadius:50,height:8}}>
        <div style=${{background:'rgba(255,255,255,.9)',borderRadius:50,height:8,width:`${pctTotal}%`,transition:'width .8s ease',boxShadow:'0 0 10px rgba(255,255,255,.4)'}}/>

          onClick=${()=>{setEditCat(c.k);setEditAmt(budget?String(budget):'');}}>
          <div style=${{display:'flex',alignItems:'center',gap:12,marginBottom:budget?10:0}}>
            <div style=${{width:42,height:42,borderRadius:12,background:c.g,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0,boxShadow:`0 4px 12px ${c.c}33`}}>
              <span style=${{filter:'brightness(0) invert(1)'}}>${c.e}</span>
            </div>
            <div style=${{flex:1}}>
              <div style=${{fontSize:14,fontWeight:700,color:'var(--text)'}}>${c.l}</div>

          </div>`}

      })}

    ${editCat&&html`<${Sheet} title=${`Budget — ${getC(editCat).e} ${getC(editCat).l}`} onClose=${()=>setEditCat(null)}
      action=${()=>{onSaveBudget(editCat,parseFloat(editAmt)||0);setEditCat(null);}} actionLabel="Enregistrer">

  </div>`;

const SavingsPage=({savings,cur,onSave,onDelete,onContrib})=>{
  const [addOpen,setAddOpen]=useState(false);
  const [editGoal,setEditGoal]=useState(null);
  const [contribGoal,setContribGoal]=useState(null);
  const [contribAmt,setContribAmt]=useState('');
  const [form,setForm]=useState({name:'',target:'',emoji:'🎯',color:'#FF1F6E',deadline:''});
  const GOAL_EMOJIS=['🎯','✈️','🏠','🚗','💻','👗','💍','🎓','🏖️','💄','📱','🛍️','🌸','💎','🐱','🎪'];
  const GOAL_COLORS=['#FF1F6E','#9B5DE5','#FF8C6B','#00D9A6','#F5A623','#4FACFE','#F472B6','#10B981'];
  const totalSaved=savings.reduce((s,g)=>s+g.current,0);
  const totalTarget=savings.reduce((s,g)=>s+g.target,0);

  return html`<div class="p-screen">
    <div style=${{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:18}}>
      <div>
        <h1 class="section-title" style=${{fontSize:26,marginBottom:2}}>Mon Épargne 🐷</h1>
        <p style=${{fontSize:13,color:'var(--muted)',fontWeight:500}}>Atteins tes objectifs un par un</p>
      </div>
      <button class="btn btn-rose btn-sm" style=${{flexShrink:0}} onClick=${()=>{setForm({name:'',target:'',emoji:'🎯',color:'#FF1F6E',deadline:''});setEditGoal(null);setAddOpen(true);}}>+ Objectif</button>
    </div>
    ${savings.length>0&&html`<div class="fu card" style=${{padding:'16px 18px',marginBottom:18,background:'var(--hero3)',backgroundSize:'200% 200%',animation:'gradShift 6s ease infinite',border:'none',boxShadow:'0 8px 28px rgba(245,166,35,.35)'}}>
      <div style=${{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.75)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Total épargné</div>
      <div style=${{fontSize:32,fontWeight:900,color:'#fff',fontFamily:"'Playfair Display',serif",marginBottom:2}}>${fmtAmt(totalSaved,cur)}</div>
      <div style=${{fontSize:13,color:'rgba(255,255,255,.7)',fontWeight:500}}>sur ${fmtAmt(totalTarget,cur)} d'objectifs</div>
    </div>`}
    ${savings.length===0?html`<div class="card" style=${{padding:'40px 20px',textAlign:'center'}}>
      <div style=${{fontSize:60,marginBottom:10,animation:'float 3s ease-in-out infinite',display:'block'}}>🐷</div>
      <div style=${{fontSize:15,fontWeight:700,color:'var(--text)',marginBottom:6}}>Aucun objectif</div>
      <div style=${{fontSize:13,color:'var(--muted)',marginBottom:20,lineHeight:1.65}}>Crée ton premier objectif d'épargne !<br/>Voyage, achat, projets…</div>
      <button class="btn btn-rose btn-sm" onClick=${()=>setAddOpen(true)}>✨ Créer un objectif</button>
    </div>`:html`<div style=${{display:'flex',flexDirection:'column',gap:12}}>
      ${savings.map((g,i)=>{
        const pct=Math.min(g.current/g.target*100,100);
        const done=pct>=100;
        return html`<div key=${g.id} class="fu card" style=${{padding:'16px 18px',animationDelay:`${i*70}ms`}}>
          <div style=${{display:'flex',alignItems:'center',gap:14,marginBottom:12}}>
            <div style=${{position:'relative',flexShrink:0}}>
              <${SavingsRing} pct=${pct} color=${g.color} size=${72}/>
              <div style=${{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24}}>
                ${done?'🎉':g.emoji}
              </div>
            </div>
            <div style=${{flex:1}}>
              <div style=${{fontSize:16,fontWeight:800,color:'var(--text)',marginBottom:2}}>${g.name}</div>
              <div style=${{fontSize:13,fontWeight:700,color:g.color}}>${fmtAmt(g.current,cur)} <span style=${{color:'var(--muted)',fontWeight:500}}>/ ${fmtAmt(g.target,cur)}</span></div>
              ${g.deadline&&html`<div style=${{fontSize:11,color:'var(--light)',fontWeight:600,marginTop:2}}>🗓 ${fmtDate(g.deadline)}</div>`}
            </div>
            <div style=${{display:'flex',flexDirection:'column',gap:5,alignItems:'flex-end'}}>
              <div style=${{fontSize:13,fontWeight:800,color:g.color}}>${Math.round(pct)}%</div>
              ${done&&html`<span style=${{fontSize:11,fontWeight:800,background:'#D1FAE5',color:'var(--mint)',padding:'2px 8px',borderRadius:50}}>✓ Atteint!</span>`}
            </div>
          </div>
          <div style=${{display:'flex',gap:8}}>
            <button class="btn btn-rose btn-sm" style=${{flex:2}} onClick=${()=>{setContribGoal(g);setContribAmt('');}}>+ Alimenter</button>
            <button class="btn btn-ghost btn-sm" style=${{flex:1}} onClick=${()=>{setForm({name:g.name,target:String(g.target),emoji:g.emoji,color:g.color,deadline:g.deadline||''});setEditGoal(g);setAddOpen(true);}}>✏️</button>
            <button class="btn btn-danger btn-sm" style=${{flex:1}} onClick=${()=>onDelete(g.id)}>🗑</button>
          </div>
        </div>`;
      })}
    </div>`}
    ${addOpen&&html`<${Sheet} title=${editGoal?'Modifier l\'objectif':'Nouvel objectif 🎯'} onClose=${()=>setAddOpen(false)}
      action=${()=>{
        const t=parseFloat(form.target);
        if(!form.name.trim()||!t||t<=0)return;
        onSave(editGoal?{...editGoal,...form,target:t}:{id:mkId(),...form,target:t,current:0,createdAt:Date.now()});
        setAddOpen(false);
      }} actionLabel=${editGoal?'Modifier':'Créer l\'objectif'}>
      <div class="inp-wrap">
        <label class="lbl">Nom de l'objectif</label>
        <input class="inp" value=${form.name} onInput=${e=>setForm(p=>({...p,name:e.target.value}))} placeholder="ex : Voyage à Ibiza ✈️"/>
      </div>
      <${FInput} label="Montant cible" value=${form.target} onChange=${v=>setForm(p=>({...p,target:v}))} type="number" prefix=${cur} placeholder="0.00"/>
      <${FInput} label="Date limite (optionnel)" value=${form.deadline} onChange=${v=>setForm(p=>({...p,deadline:v}))} type="date"/>
      <div class="inp-wrap">
        <label class="lbl">Emoji</label>
        <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
          ${GOAL_EMOJIS.map(e=>html`<button key=${e} onClick=${()=>setForm(p=>({...p,emoji:e}))}
            style=${{fontSize:24,padding:'8px',borderRadius:10,border:`2px solid ${form.emoji===e?'var(--rose)':'var(--border)'}`,background:form.emoji===e?'var(--rose-light)':'transparent',cursor:'pointer'}}>${e}</button>`)}
        </div>
      </div>
      <div class="inp-wrap">
        <label class="lbl">Couleur</label>
        <div style=${{display:'flex',gap:8}}>
          ${GOAL_COLORS.map(c=>html`<button key=${c} onClick=${()=>setForm(p=>({...p,color:c}))}
            style=${{width:30,height:30,borderRadius:'50%',background:c,border:`3px solid ${form.color===c?'var(--text)':'transparent'}`,cursor:'pointer'}}/>` )}
        </div>
      </div>
    </${Sheet}>`}
    ${contribGoal&&html`<${Sheet} title=${`Alimenter — ${contribGoal.emoji} ${contribGoal.name}`} onClose=${()=>setContribGoal(null)}
      action=${()=>{const n=parseFloat(contribAmt);if(n>0){onContrib(contribGoal.id,n);setContribGoal(null);}}} actionLabel="Ajouter">
      <${FInput} label="Montant à ajouter" value=${contribAmt} onChange=${setContribAmt} type="number" prefix=${cur} placeholder="0.00"/>
      <div style=${{background:'var(--gold-light)',borderRadius:14,padding:'13px 15px',marginBottom:16}}>
        <div style=${{fontSize:13,fontWeight:600,color:'var(--gold)'}}>Épargne actuelle : <strong>${fmtAmt(contribGoal.current,cur)}</strong></div>
        <div style=${{fontSize:13,fontWeight:600,color:'var(--gold)'}}>Objectif : <strong>${fmtAmt(contribGoal.target,cur)}</strong></div>
        <div style=${{fontSize:13,fontWeight:600,color:'var(--gold)'}}>Reste : <strong>${fmtAmt(Math.max(contribGoal.target-contribGoal.current,0),cur)}</strong></div>
      </div>
    </${Sheet}>`}
    <div style=${{height:8}}/>
  </div>`;
};

const ChatPage=({txs,savings,budgets,cur,apiKey,name})=>{
  const [msgs,setMsgs]=useState(()=>LS.get('fin-chat',[]));
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  const monthTxs=txs.filter(t=>isThisMonth(t.date));
  const income=monthTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=monthTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const topCats=Object.entries(monthTxs.filter(t=>t.type==='expense').reduce((acc,t)=>{acc[t.cat]=(acc[t.cat]||0)+t.amount;return acc},{}))
    .sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${getC(k).e}${getC(k).l}:${v.toFixed(0)}${cur}`).join(', ');
  const totalSaved=savings.reduce((s,g)=>s+g.current,0);

  const sysPrompt=`Tu es Finella AI, une assistante financière personnelle chaleureuse, bienveillante et experte en gestion de budget. Tu analyses les données financières de ${name} et tu lui donnes des conseils personnalisés, bienveillants, pratiques et concrets. Tu parles en français, avec une touche amicale et encourageante. Tu utilises des emojis pour rendre tes messages vivants.

Données financières actuelles de ${name} :
- Revenus ce mois : ${income.toFixed(2)}${cur}
- Dépenses ce mois : ${expense.toFixed(2)}${cur}
- Solde : ${(income-expense).toFixed(2)}${cur}
- Top dépenses : ${topCats||'aucune'}
- Épargne totale : ${totalSaved.toFixed(2)}${cur}
- Objectifs d'épargne : ${savings.map(g=>`${g.emoji}${g.name}(${g.current.toFixed(0)}/${g.target.toFixed(0)}${cur})`).join(', ')||'aucun'}
- Transactions ce mois : ${monthTxs.length}

Réponds toujours de façon personnalisée en utilisant ces données. Sois concise (3-5 phrases max par message), positive et utile.`;

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading]);
  useEffect(()=>{ LS.set('fin-chat',msgs.slice(-40)); },[msgs]);

  const send=async()=>{
    if(!input.trim()||loading)return;
    const userMsg={role:'user',content:input.trim(),id:mkId()};
    const newMsgs=[...msgs,userMsg];
    setMsgs(newMsgs); setInput(''); setLoading(true);
    if(!apiKey){
      setLoading(false);
      setMsgs(m=>[...m,{role:'assistant',content:`Salut ${name} 💖 ! Pour que je puisse t'aider, il me faut ta clé API Anthropic. Va dans Réglages → Clé API et colle-la là. Tu peux l'obtenir sur console.anthropic.com 🌸`,id:mkId()}]);
      return;
    }
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-allow-any-origin':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sysPrompt,messages:newMsgs.map(m=>({role:m.role,content:m.content}))})
      });
      const data=await res.json();
      const reply=data.content?.[0]?.text||'Désolée, je n\'ai pas pu traiter ta demande. 💔';
      setMsgs(m=>[...m,{role:'assistant',content:reply,id:mkId()}]);
    }catch(e){
      setMsgs(m=>[...m,{role:'assistant',content:'Oups ! Une erreur réseau s\'est produite. Vérifie ta clé API et ta connexion 💫',id:mkId()}]);
    }
    setLoading(false);
  };

  const SUGGESTIONS=['Analyse mes dépenses du mois 📊','Comment économiser davantage ? 💰','Où est-ce que je gaspille ? 🔍','Conseil pour atteindre mes objectifs ✨'];

  return html`<div style=${{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
    
    <div style=${{background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 6s ease infinite',padding:'calc(var(--safe-top) + 14px) 18px 16px',flexShrink:0,boxShadow:'0 4px 20px var(--rose-glow)'}}>
      <div style=${{display:'flex',alignItems:'center',gap:12}}>
        <div style=${{width:42,height:42,borderRadius:14,background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,backdropFilter:'blur(10px)'}}>💖</div>
        <div>
          <div style=${{fontSize:16,fontWeight:800,color:'#fff'}}>Finella AI ✨</div>
          <div style=${{fontSize:11,color:'rgba(255,255,255,.7)',fontWeight:500}}>Ton assistante financière IA</div>
        </div>
        <button onClick=${()=>setMsgs([])} style=${{marginLeft:'auto',background:'rgba(255,255,255,.15)',border:'none',borderRadius:10,padding:'6px 12px',color:'#fff',cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'inherit'}}>Effacer</button>
      </div>
    </div>
    
    <div style=${{flex:1,overflowY:'auto',padding:'16px 16px 0',display:'flex',flexDirection:'column',gap:12}}>
      ${msgs.length===0&&html`<div style=${{textAlign:'center',padding:'20px 0 10px'}}>
        <div style=${{fontSize:52,marginBottom:8,animation:'float 3s ease-in-out infinite',display:'block'}}>🌸</div>
        <div style=${{fontSize:16,fontWeight:700,color:'var(--text)',marginBottom:4}}>Coucou ${name} ! 👋</div>
        <div style=${{fontSize:13,color:'var(--muted)',lineHeight:1.7,marginBottom:20}}>Je suis Finella, ton assistante financière IA.<br/>Pose-moi n'importe quelle question sur tes finances !</div>
        <div style=${{display:'flex',flexDirection:'column',gap:8}}>
          ${SUGGESTIONS.map(s=>html`<button key=${s} onClick=${()=>{setInput(s);}} style=${{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:14,padding:'11px 14px',cursor:'pointer',fontSize:13,fontWeight:600,color:'var(--violet)',textAlign:'left',fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>${s}</button>`)}
        </div>
      </div>`}
      ${msgs.map((m,i)=>html`<div key=${m.id||i} style=${{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',animationDelay:`${i*30}ms`}}>
        ${m.role==='assistant'&&html`<div style=${{width:28,height:28,borderRadius:10,background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 5s ease infinite',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0,marginRight:8,marginTop:4}}>💖</div>`}
        <div class=${`chat-bubble ${m.role==='ai'||m.role==='assistant'?'bubble-ai':'bubble-user'}`} style=${{animationDelay:`${i*30}ms`}}>
          ${m.content}
        </div>
      </div>`)}
      ${loading&&html`<div style=${{display:'flex',justifyContent:'flex-start',gap:8,alignItems:'flex-start'}}>
        <div style=${{width:28,height:28,borderRadius:10,background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 5s ease infinite',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0,marginTop:4}}>💖</div>
        <div class="bubble-ai" style=${{display:'flex',gap:5,alignItems:'center',padding:'14px 18px'}}>
          <div class="typing-dot"/><div class="typing-dot"/><div class="typing-dot"/>
        </div>
      </div>`}
      <div ref=${endRef}/>
    </div>
    
    <div style=${{padding:'12px 16px',paddingBottom:`calc(var(--safe-bottom) + 100px)`,background:'var(--surface)',borderTop:'1px solid var(--border)',display:'flex',gap:10,flexShrink:0}}>
      <input class="inp" value=${input} onInput=${e=>setInput(e.target.value)}
        onKeyDown=${e=>e.key==='Enter'&&send()}
        placeholder="Parle à Finella…" style=${{flex:1,padding:'12px 16px',fontSize:14}}/>
      <button onClick=${send} disabled=${loading||!input.trim()} class="btn btn-rose" style=${{padding:'12px 18px',borderRadius:14,fontSize:20,flexShrink:0,opacity:(loading||!input.trim())?0.5:1}}>
        ${loading?html`<div style=${{width:20,height:20,borderRadius:'50%',border:'3px solid rgba(255,255,255,.3)',borderTopColor:'#fff',animation:'spin .7s linear infinite'}}/>`:html`→`}
      </button>
    </div>
  </div>`;
};

const SettingsPage=({settings,onSave,onClear})=>{
  const [name,setName]=useState(settings.name);
  const [cur,setCur]=useState(settings.currency);
  const [apiKey,setApiKey]=useState(settings.apiKey||'');
  const [showKey,setShowKey]=useState(false);
  return html`<div class="p-screen">
    <h1 class="section-title" style=${{fontSize:26,marginBottom:20}}>Réglages ⚙️</h1>
    <div class="card" style=${{padding:'18px',marginBottom:16}}>
      <h3 style=${{fontSize:14,fontWeight:700,color:'var(--muted)',marginBottom:14,textTransform:'uppercase',letterSpacing:'.08em'}}>Mon profil</h3>
      <${FInput} label="Prénom" value=${name} onChange=${setName} placeholder="Ton prénom"/>
      <${FSelect} label="Devise" value=${cur} onChange=${setCur} options=${CURRENCIES.map(c=>({v:c.s,l:`${c.s} — ${c.l}`}))}/>
      <button class="btn btn-rose btn-sm" style=${{width:'100%'}} onClick=${()=>onSave({name,currency:cur,apiKey})}>Enregistrer</button>
    </div>
    <div class="card" style=${{padding:'18px',marginBottom:16}}>
      <h3 style=${{fontSize:14,fontWeight:700,color:'var(--muted)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.08em'}}>IA — Clé Anthropic</h3>
      <p style=${{fontSize:12,color:'var(--muted)',marginBottom:14,lineHeight:1.65}}>Pour utiliser Finella AI, obtiens ta clé sur <strong>console.anthropic.com</strong> → API Keys. Elle est stockée uniquement sur ton appareil.</p>
      <div class="inp-wrap">
        <label class="lbl">Clé API</label>
        <div style=${{position:'relative'}}>
          <input class="inp" type=${showKey?'text':'password'} value=${apiKey} onInput=${e=>setApiKey(e.target.value)} placeholder="sk-ant-…"/>
          <button onClick=${()=>setShowKey(v=>!v)} style=${{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:18}}>${showKey?'🙈':'👁️'}</button>
        </div>
      </div>
      <button class="btn btn-rose btn-sm" style=${{width:'100%'}} onClick=${()=>onSave({name,currency:cur,apiKey})}>Enregistrer la clé</button>
    </div>
    <div class="card" style=${{padding:'18px'}}>
      <h3 style=${{fontSize:14,fontWeight:700,color:'#E53935',marginBottom:12,textTransform:'uppercase',letterSpacing:'.08em'}}>Zone danger 🚨</h3>
      <button class="btn btn-danger" style=${{width:'100%'}} onClick=${()=>{if(confirm('Supprimer TOUTES les données ? Cette action est irréversible.'))onClear();}}>Réinitialiser toutes les données</button>
    </div>
    <div style=${{height:16}}/>
  </div>`;
};

function App(){
  const [settings,setSettings]=useState(()=>LS.get('fin-settings',null));
  const [txs,setTxs]=useState(()=>LS.get('fin-txs',[]));
  const [budgets,setBudgets]=useState(()=>LS.get('fin-budgets',{}));
  const [savings,setSavings]=useState(()=>LS.get('fin-savings',[]));
  const [page,setPage]=useState('home');
  const [addOpen,setAddOpen]=useState(false);
  const [editTx,setEditTx]=useState(null);
  const [animKey,setAnimKey]=useState(0);

  const cur=settings?.currency||'€';
  window._finCur=cur;

  useEffect(()=>{LS.set('fin-txs',txs)},[txs]);
  useEffect(()=>{LS.set('fin-budgets',budgets)},[budgets]);
  useEffect(()=>{LS.set('fin-savings',savings)},[savings]);
  useEffect(()=>{LS.set('fin-settings',settings)},[settings]);

  const navTo=p=>{setPage(p);setAnimKey(k=>k+1)};

  if(!settings) return html`<${Onboarding} onDone=${s=>setSettings(s)}/>`;

  const saveTx=t=>{
    setTxs(prev=>{
      const i=prev.findIndex(x=>x.id===t.id);
      return i>=0?prev.map(x=>x.id===t.id?t:x):[...prev,t];
    });
    setEditTx(null);
  };
  const delTx=id=>setTxs(prev=>prev.filter(t=>t.id!==id));
  const saveBudget=(k,v)=>setBudgets(p=>{const n={...p};if(v===0)delete n[k];else n[k]=v;return n});
  const saveGoal=g=>setSavings(prev=>{const i=prev.findIndex(x=>x.id===g.id);return i>=0?prev.map(x=>x.id===g.id?g:x):[...prev,g]});
  const delGoal=id=>setSavings(prev=>prev.filter(g=>g.id!==id));
  const addContrib=(id,amt)=>setSavings(prev=>prev.map(g=>g.id===id?{...g,current:Math.min(g.current+amt,g.target)}:g));
  const clearAll=()=>{setTxs([]);setBudgets({});setSavings([]);LS.set('fin-chat',[]);setSettings(s=>({...s}))};

  const NAV=[
    {id:'home',icon:'🏠',label:'Accueil'},
    {id:'txs',icon:'💳',label:'Dépenses'},
    {id:'budget',icon:'📊',label:'Budget'},
    {id:'savings',icon:'🐷',label:'Épargne'},
    {id:'chat',icon:'💬',label:'IA'},
  ];

  return html`<div id="app" style=${{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden',position:'relative'}}>
    
    ${page!=='chat'&&html`<div style=${{paddingTop:'var(--safe-top)',background:'var(--bg)',flexShrink:0}}>
      <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px 4px'}}>
        <div style=${{fontSize:16,fontFamily:"'Playfair Display',serif",fontWeight:700,color:'var(--text)'}}>
          Finella <span style=${{background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 5s ease infinite',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>💖</span>
        </div>
        <button onClick=${()=>navTo('settings')} style=${{background:'none',border:'none',cursor:'pointer',fontSize:22,WebkitTapHighlightColor:'transparent',padding:'4px'}}>
          ${page==='settings'?'✕':'⚙️'}
        </button>
      </div>
    </div>`}
    
    <div class=${`screen ${page==='chat'?'no-nav':''}`} style=${{flex:1}}>
      <div key=${animKey} class="fu">
        ${page==='home'&&html`<${HomePage} txs=${txs} savings=${savings} name=${settings.name} cur=${cur} onAdd=${()=>setAddOpen(true)}/>`}
        ${page==='txs'&&html`<${TxPage} txs=${txs} cur=${cur} onEdit=${t=>{setEditTx(t);setAddOpen(true);}} onDelete=${delTx}/>`}
        ${page==='budget'&&html`<${BudgetPage} txs=${txs} budgets=${budgets} cur=${cur} onSaveBudget=${saveBudget}/>`}
        ${page==='savings'&&html`<${SavingsPage} savings=${savings} cur=${cur} onSave=${saveGoal} onDelete=${delGoal} onContrib=${addContrib}/>`}
        ${page==='chat'&&html`<${ChatPage} txs=${txs} savings=${savings} budgets=${budgets} cur=${cur} apiKey=${settings.apiKey} name=${settings.name}/>`}
        ${page==='settings'&&html`<${SettingsPage} settings=${settings} onSave=${s=>{setSettings(prev=>({...prev,...s}));navTo('home');}} onClear=${clearAll}/>`}
      </div>
    </div>
    
    ${page!=='chat'&&page!=='settings'&&html`<nav class="bot-nav">
      ${NAV.map(n=>html`<button key=${n.id} class=${`nav-btn ${page===n.id?'active':''}`} onClick=${()=>navTo(n.id)}>
        <span class="nav-icon">${n.icon}</span>
        <span class="nav-label">${n.label}</span>
      </button>`)}
    </nav>`}
    ${page==='chat'&&html`<nav class="bot-nav">
      ${NAV.map(n=>html`<button key=${n.id} class=${`nav-btn ${page===n.id?'active':''}`} onClick=${()=>navTo(n.id)}>
        <span class="nav-icon">${n.icon}</span>
        <span class="nav-label">${n.label}</span>
      </button>`)}
    </nav>`}
    
    ${['home','txs','budget'].includes(page)&&html`<button class="fab" onClick=${()=>{setEditTx(null);setAddOpen(true);}}>＋</button>`}
    
    ${(addOpen||editTx)&&html`<${TxForm} onClose=${()=>{setAddOpen(false);setEditTx(null);}} onSave=${saveTx} initial=${editTx}/>`}
  </div>`;
}

render(html`<${App}/>`,document.getElementById('root'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
