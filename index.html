<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salbath">
<meta name="theme-color" content="#E0176C">
<title>Salbath 💖</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#E0176C;--rose2:#FF5BAA;--roseL:#FFE6F2;--roseG:rgba(224,23,108,.25);
  --violet:#8B47E8;--violetL:#EDE4FF;
  --peach:#FF7D5C;--mint:#00CFA8;--mintL:#CCFAF2;
  --gold:#F0A500;--goldL:#FEF4D4;
  --sky:#4FACFE;--skyL:#DDEFFF;
  --bg:#FFF2F8;--card:#FFFFFF;
  --text:#1C0A28;--muted:#9474B4;--faint:#C9B0D8;
  --border:rgba(139,71,232,.1);
  --hero:linear-gradient(135deg,#E0176C 0%,#8B47E8 55%,#FF7D5C 100%);
  --g2:linear-gradient(135deg,#00CFA8,#4FACFE);
  --g3:linear-gradient(135deg,#F0A500,#FF7D5C);
  --g4:linear-gradient(135deg,#8B47E8,#E0176C);
  --ST:env(safe-area-inset-top,0px);
  --SB:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#app{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
::-webkit-scrollbar{display:none}
input,select,textarea,button{font-family:inherit}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* ── ANIMATIONS ── */
@keyframes FU{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes FI{from{opacity:0}to{opacity:1}}
@keyframes SU{from{transform:translateY(100%)}to{transform:none}}
@keyframes FL{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes SK{to{transform:rotate(360deg)}}
@keyframes GS{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes PL{0%,100%{box-shadow:0 0 0 0 var(--roseG)}60%{box-shadow:0 0 0 18px transparent}}
@keyframes RI{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--e)}}
@keyframes MB{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes MI{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden}
.has-nav{padding-bottom:calc(70px + var(--SB))}

/* ── CARDS ── */
.card{background:var(--card);border-radius:22px;box-shadow:0 3px 18px rgba(139,71,232,.08);border:1.5px solid var(--border)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font-family:inherit;font-weight:800;transition:transform .13s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.93)}
.btn-hero{background:var(--hero);background-size:200%;animation:GS 5s ease infinite;color:#fff;border-radius:17px;padding:14px 24px;font-size:15px;box-shadow:0 7px 22px var(--roseG)}
.btn-ghost{background:rgba(139,71,232,.07);color:var(--muted);border:1.5px solid var(--border);border-radius:14px;padding:11px 20px;font-size:14px}
.btn-danger{background:#FFF0F5;color:#C81A5E;border:1.5px solid #FFD6E8;border-radius:14px;padding:11px 20px;font-size:14px}
.btn-sm{padding:9px 16px!important;font-size:13px!important;border-radius:13px!important}

/* ── INPUTS ── */
.inp{width:100%;padding:13px 15px;font-size:15px;font-weight:600;color:var(--text);background:#FBF4FF;border:2px solid var(--border);border-radius:15px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,71,232,.1);background:#fff}
.lbl{display:block;font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.iw{margin-bottom:14px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(139,71,232,.08);display:flex;padding-bottom:var(--SB);z-index:90;box-shadow:0 -3px 20px rgba(139,71,232,.07)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 2px 7px;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;min-height:54px}
.nb .ni{font-size:20px;line-height:1;transition:transform .2s}
.nb .nl{font-size:9px;font-weight:800;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;transition:color .2s;margin-top:1px}
.nb.on .nl{color:var(--rose)}
.nb.on .ni{transform:scale(1.2)}
.nb::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);height:2.5px;border-radius:0 0 3px 3px;background:var(--hero);background-size:200%;animation:GS 5s ease infinite;transition:width .25s cubic-bezier(.23,1,.32,1);width:0}
.nb.on::after{width:32px}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--SB) + 64px);right:16px;width:56px;height:56px;border-radius:50%;background:var(--hero);background-size:200%;animation:GS 5s ease infinite,PL 2.5s ease infinite;color:#fff;border:none;font-size:25px;cursor:pointer;z-index:91;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 24px var(--roseG);-webkit-tap-highlight-color:transparent;transition:transform .13s}
.fab:active{transform:scale(.88)}

/* ── SHEET MODAL ── */
.ov{position:fixed;inset:0;background:rgba(28,10,40,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:200;animation:FI .2s ease;display:flex;align-items:flex-end}
.sh{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-height:93vh;overflow-y:auto;animation:SU .35s cubic-bezier(.23,1,.32,1);padding-bottom:calc(20px + var(--SB))}
.sh-bar{width:42px;height:4px;background:var(--border);border-radius:2px;margin:13px auto 16px}
.sh-head{padding:0 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:2px}
.sh-body{padding:14px 20px 0}
.sh-foot{padding:10px 20px 0;display:flex;gap:9px}

/* ── MISC ── */
.seg{display:flex;background:#F0E8FF;border-radius:13px;padding:3px;gap:3px}
.sb{flex:1;padding:9px 4px;border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:all .2s;color:var(--muted);background:transparent}
.sb.on{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(139,71,232,.12)}
.chip{padding:6px 13px;border-radius:50px;font-size:11.5px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:transparent;color:var(--muted);-webkit-tap-highlight-color:transparent;white-space:nowrap;font-family:inherit;transition:all .18s}
.chip.on{border-color:var(--rose);background:var(--roseL);color:var(--rose)}
.pt{background:#EEE4FF;border-radius:50px;height:7px;overflow:hidden}
.pf{height:100%;border-radius:50px;transition:width .9s cubic-bezier(.23,1,.32,1)}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tx:last-child{border-bottom:none}
.tx:active{opacity:.65}
.dsep{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:12px 0 7px}
.pg{padding:18px 16px}
.bub{max-width:82%;padding:11px 15px;border-radius:19px;font-size:14px;font-weight:600;line-height:1.65;animation:MI .3s ease both}
.bub-ai{background:var(--card);color:var(--text);border-radius:3px 19px 19px 19px;box-shadow:0 2px 12px rgba(139,71,232,.09)}
.bub-u{background:var(--hero);background-size:200%;animation:GS 5s ease infinite,MI .3s ease both;color:#fff;border-radius:19px 3px 19px 19px}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:MB 1.2s ease-in-out infinite}
.tdot:nth-child(2){animation-delay:.18s}
.tdot:nth-child(3){animation-delay:.36s}
.cati{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import{h,render}from'https://esm.sh/preact@10.19.3';
import{useState,useEffect,useRef,useCallback}from'https://esm.sh/preact@10.19.3/hooks';
import htm from'https://esm.sh/htm@3.1.1';
const H=htm.bind(h);

// ── DATA ──
const CATS=[
  {k:'shopping',l:'Shopping',e:'🛍️',c:'#E0176C',bg:'#FFE6F2',g:'linear-gradient(135deg,#E0176C,#FF7D5C)',t:'e'},
  {k:'courses',l:'Courses',e:'🛒',c:'#00B894',bg:'#CCFAF2',g:'linear-gradient(135deg,#00CFA8,#4FACFE)',t:'e'},
  {k:'restaurant',l:'Restaurant',e:'🍽️',c:'#FF7D5C',bg:'#FFEDE7',g:'linear-gradient(135deg,#FF7D5C,#F0A500)',t:'e'},
  {k:'logement',l:'Logement',e:'🏠',c:'#8B47E8',bg:'#EDE4FF',g:'linear-gradient(135deg,#8B47E8,#B57FFF)',t:'e'},
  {k:'sante',l:'Santé',e:'💊',c:'#00CFA8',bg:'#CCFAF2',g:'linear-gradient(135deg,#00CFA8,#38BDF8)',t:'e'},
  {k:'transport',l:'Transport',e:'🚗',c:'#4FACFE',bg:'#DDEFFF',g:'linear-gradient(135deg,#4FACFE,#818CF8)',t:'e'},
  {k:'beaute',l:'Beauté',e:'💄',c:'#F472B6',bg:'#FFE0F5',g:'linear-gradient(135deg,#F472B6,#E879F9)',t:'e'},
  {k:'loisirs',l:'Loisirs',e:'🎬',c:'#F0A500',bg:'#FEF4D4',g:'linear-gradient(135deg,#F0A500,#FF7D5C)',t:'e'},
  {k:'abos',l:'Abonnements',e:'📱',c:'#818CF8',bg:'#E8EAFF',g:'linear-gradient(135deg,#818CF8,#8B47E8)',t:'e'},
  {k:'voyages',l:'Voyages',e:'✈️',c:'#06B6D4',bg:'#CDFAFF',g:'linear-gradient(135deg,#06B6D4,#38BDF8)',t:'e'},
  {k:'soins',l:'Soins',e:'🧴',c:'#EC4899',bg:'#FDE8F5',g:'linear-gradient(135deg,#EC4899,#F472B6)',t:'e'},
  {k:'sport',l:'Sport',e:'🏋️',c:'#10B981',bg:'#D1FAE5',g:'linear-gradient(135deg,#10B981,#34D399)',t:'e'},
  {k:'enfants',l:'Enfants',e:'🧸',c:'#FCA5A5',bg:'#FEE2E2',g:'linear-gradient(135deg,#FCA5A5,#F472B6)',t:'e'},
  {k:'cadeaux',l:'Cadeaux',e:'🎁',c:'#F59E0B',bg:'#FEF3C7',g:'linear-gradient(135deg,#F59E0B,#FF7D5C)',t:'e'},
  {k:'education',l:'Éducation',e:'📚',c:'#6366F1',bg:'#E0E1FF',g:'linear-gradient(135deg,#6366F1,#8B47E8)',t:'e'},
  {k:'autre',l:'Autre',e:'💸',c:'#94A3B8',bg:'#E8EDF2',g:'linear-gradient(135deg,#94A3B8,#CBD5E1)',t:'e'},
  {k:'salaire',l:'Salaire',e:'💼',c:'#10B981',bg:'#D1FAE5',g:'linear-gradient(135deg,#10B981,#06B6D4)',t:'i'},
  {k:'freelance',l:'Freelance',e:'💻',c:'#34D399',bg:'#CCFCE7',g:'linear-gradient(135deg,#34D399,#4FACFE)',t:'i'},
  {k:'remb',l:'Remboursement',e:'💰',c:'#F59E0B',bg:'#FEF3C7',g:'linear-gradient(135deg,#F59E0B,#FBBF24)',t:'i'},
  {k:'invest',l:'Investissement',e:'📈',c:'#3B82F6',bg:'#DBEAFE',g:'linear-gradient(135deg,#3B82F6,#8B47E8)',t:'i'},
  {k:'alloc',l:'Allocation',e:'🏛️',c:'#8B47E8',bg:'#EDE4FF',g:'linear-gradient(135deg,#8B47E8,#E0176C)',t:'i'},
];
const CURS=[{s:'€',l:'EUR'},{s:'$',l:'USD'},{s:'£',l:'GBP'},{s:'FCFA',l:'XOF'},{s:'MAD',l:'MAD'},{s:'CHF',l:'CHF'}];
const PRIOS=[{k:'high',l:'Urgente',c:'#E0176C',bg:'#FFE6F2'},{k:'med',l:'Normale',c:'#F0A500',bg:'#FEF4D4'},{k:'low',l:'Envie',c:'#8B47E8',bg:'#EDE4FF'}];
const WE=['🛍️','👗','💄','👟','💻','📱','✈️','🎁','💍','🧴','👜','🌸','🎬','🎮','📚','🏠'];
const GE=['💎','✈️','🏠','🚗','💻','👗','💍','🎓','🏖️','💄','📱','🌸','💫','🎪','🐱','⭐'];
const GC=['#E0176C','#8B47E8','#FF7D5C','#00CFA8','#F0A500','#4FACFE','#F472B6','#10B981'];

const gC=k=>CATS.find(c=>c.k===k)||CATS[CATS.length-1];
const gP=k=>PRIOS.find(p=>p.k===k)||PRIOS[1];
const mkId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fa=(n,cur)=>{if(!n&&n!==0)return`${cur||'€'}0.00`;const s=Math.abs(+n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');return cur==='FCFA'?`${s} FCFA`:`${cur||'€'}${s}`;};
const fd=d=>{try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}catch{return d}};
const dk=d=>{try{return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}catch{return d}};
const tm=()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`};
const itm=d=>d&&d.startsWith(tm());
const LS={g:(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d}catch{return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

// ── ATOMS ──
const Inp=({label,value,onChange,type='text',placeholder='',pre,min,step,rows})=>{
  const common={className:'inp',value:value||'',onInput:e=>onChange(e.target.value),placeholder,style:pre?{paddingLeft:36}:{}};
  return H`<div class="iw">
    ${label&&H`<label class="lbl">${label}</label>`}
    <div style=${{position:'relative'}}>
      ${pre&&H`<span style=${{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontWeight:800,color:'var(--muted)',fontSize:14,pointerEvents:'none'}}>${pre}</span>`}
      ${rows?H`<textarea ...${common} rows=${rows} style=${{resize:'vertical',lineHeight:1.6,...(pre?{paddingLeft:36}:{})}}/>`:H`<input ...${common} type=${type} min=${min} step=${step}/>`}
    </div>
  </div>`;
};
const Sel=({label,value,onChange,opts})=>H`<div class="iw">
  ${label&&H`<label class="lbl">${label}</label>`}
  <select class="inp" style=${{cursor:'pointer',appearance:'none',backgroundImage:`url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%239474B4' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E")`,backgroundRepeat:'no-repeat',backgroundPosition:'right 13px center',paddingRight:40}} value=${value} onChange=${e=>onChange(e.target.value)}>
    ${opts.map(o=>H`<option key=${o.v} value=${o.v}>${o.l}</option>`)}
  </select>
</div>`;

const Modal=({title,onClose,onSave,saveLabel='Enregistrer ✓',children})=>H`
  <div class="ov" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div class="sh">
      <div class="sh-bar"/>
      <div class="sh-head">
        <h2 class="serif" style=${{fontSize:21,fontWeight:700,color:'var(--text)'}}>${title}</h2>
        <button onClick=${onClose} style=${{background:'rgba(139,71,232,.1)',border:'none',borderRadius:'50%',width:34,height:34,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:18,color:'var(--muted)',lineHeight:1}}>×</button>
      </div>
      <div class="sh-body">${children}</div>
      ${onSave&&H`<div class="sh-foot">
        <button onClick=${onClose} class="btn btn-ghost" style=${{flex:1}}>Annuler</button>
        <button onClick=${onSave} class="btn btn-hero" style=${{flex:2,padding:'13px'}}>${saveLabel}</button>
      </div>`}
    </div>
  </div>`;

const CatGrid=({value,onChange,type})=>{
  const cats=CATS.filter(c=>c.t===(type==='income'?'i':'e'));
  return H`<div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:7}}>
    ${cats.map(c=>H`<button key=${c.k} onClick=${()=>onChange(c.k)} style=${{background:value===c.k?c.g:c.bg,borderRadius:12,border:`2px solid ${value===c.k?c.c:'transparent'}`,padding:'9px 3px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all .16s',boxShadow:value===c.k?`0 3px 12px ${c.c}44`:'none',WebkitTapHighlightColor:'transparent'}}>
      <span style=${{fontSize:19,lineHeight:1}}>${c.e}</span>
      <span style=${{fontSize:8,fontWeight:800,color:value===c.k?'#fff':c.c,textAlign:'center',lineHeight:1.2}}>${c.l}</span>
    </button>`)}
  </div>`;
};

const Ring=({pct,color,size=68})=>{
  const R=26,ci=2*Math.PI*R,fi=Math.min(pct,100)/100*ci;
  return H`<svg style=${{transform:'rotate(-90deg)',flexShrink:0}} width=${size} height=${size} viewBox="0 0 68 68">
    <circle cx="34" cy="34" r=${R} fill="none" stroke="#EDE4FF" stroke-width="6"/>
    <circle cx="34" cy="34" r=${R} fill="none" stroke=${color} stroke-width="6" stroke-linecap="round"
      stroke-dasharray=${ci} stroke-dashoffset=${ci-fi}
      style=${{animation:'RI 1.1s cubic-bezier(.23,1,.32,1) both',['--c']:ci,['--e']:ci-fi}}/>
  </svg>`;
};

const Donut=({data,size=140,cur})=>{
  const tot=data.reduce((s,d)=>s+d.v,0);
  if(!tot)return H`<div style=${{width:size,height:size,borderRadius:'50%',background:'#EDE4FF',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'var(--muted)',fontWeight:700}}>Vide</div>`;
  const R=52,ci=2*Math.PI*R;let off=0;
  const sg=data.map(d=>{const len=d.v/tot*ci;const s={...d,off,len};off+=len;return s;});
  return H`<div style=${{position:'relative',width:size,height:size,flexShrink:0}}>
    <svg width=${size} height=${size} viewBox="0 0 140 140" style=${{transform:'rotate(-90deg)'}}>
      <circle cx="70" cy="70" r=${R} fill="none" stroke="#EDE4FF" stroke-width="18"/>
      ${sg.map((s,i)=>H`<circle key=${i} cx="70" cy="70" r=${R} fill="none" stroke=${s.c} stroke-width="18"
        stroke-dasharray="${s.len} ${ci}" stroke-dashoffset=${-s.off} stroke-linecap="round"/>`)}
    </svg>
    <div style=${{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:1}}>
      <span style=${{fontSize:9,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em'}}>Dépenses</span>
      <span class="serif" style=${{fontSize:14,fontWeight:700,color:'var(--text)',lineHeight:1}}>${fa(tot,cur)}</span>
    </div>
  </div>`;
};

const Avatar=({photo,name,size=42,ring})=>{
  const ini=(name||'').slice(0,2).toUpperCase()||'S';
  return H`<div style=${{width:size,height:size,borderRadius:'50%',background:photo?'#eee':'var(--hero)',backgroundSize:'200%',animation:photo?undefined:'GS 5s ease infinite',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0,boxShadow:ring?`0 0 0 3px white,0 3px 14px var(--roseG)`:undefined}}>
    ${photo?H`<img src=${photo} style=${{width:'100%',height:'100%',objectFit:'cover'}} alt="photo"/>`:H`<span style=${{fontSize:size*.36,fontWeight:900,color:'#fff',lineHeight:1,fontFamily:'Nunito,sans-serif'}}>${ini}</span>`}
  </div>`;
};

// ── TX FORM ──
const TxForm=({onClose,onSave,init})=>{
  const cur=window._cur||'€';
  const [type,setType]=useState(init?.type||'expense');
  const [amt,setAmt]=useState(init?.amount?String(init.amount):'');
  const [cat,setCat]=useState(init?.cat||(init?.type==='income'?'salaire':'shopping'));
  const [desc,setDesc]=useState(init?.desc||'');
  const [date,setDate]=useState(init?.date||new Date().toISOString().split('T')[0]);
  const [note,setNote]=useState(init?.note||'');
  const [recur,setRecur]=useState(init?.recur||false);
  const save=()=>{
    const n=parseFloat(amt);
    if(!n||n<=0)return;
    onSave({id:init?.id||mkId(),type,amount:n,cat,desc,date,note,recur});
    onClose();
  };

  const saved=savings.reduce((s,g)=>s+g.current,0);

      <div style=${{position:'absolute',top:-45,right:-45,width:170,height:170,borderRadius:'50%',background:'rgba(255,255,255,.06)'}}/>
      <div style=${{position:'relative',zIndex:1}}>
        <div style=${{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.62)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:5}}>Solde mensuel</div>
        <div class="serif" style=${{fontSize:40,fontWeight:700,color:'#fff',lineHeight:1,marginBottom:14,letterSpacing:'-.02em'}}>${bal>=0?'+':''}${fa(bal,cur)}</div>
        <div style=${{display:'flex',gap:14}}>

            <div style=${{fontSize:10,color:lc,fontWeight:700,marginBottom:2}}>${l}</div>
            <div class="serif" style=${{fontSize:16,fontWeight:700,color:'rgba(255,255,255,.96)',lineHeight:1}}>${fa(v,cur)}</div>
          </div>`)}

      </div>
    </div>

    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:12}}>
      <div class="card fu" style=${{padding:'13px 14px',animationDelay:'50ms'}}>
        <div style=${{fontSize:9.5,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:5}}>Ce mois</div>
        <div class="serif" style=${{fontSize:22,fontWeight:700,color:'var(--rose)',marginBottom:1}}>${mt.filter(t=>t.type==='expense').length}</div>
        <div style=${{fontSize:11,color:'var(--faint)',fontWeight:700}}>dépenses</div>

        <div style=${{fontSize:11,color:'var(--faint)',fontWeight:700}}>atteints</div>
      </div>
    </div>

    ${catD.length>0&&H`<div class="card fu" style=${{padding:'15px 15px 13px',marginBottom:12,animationDelay:'100ms'}}>
      <h3 class="serif" style=${{fontSize:17,fontWeight:700,marginBottom:12}}>Dépenses du mois</h3>

          <div style=${{width:'100%',borderRadius:'5px 5px 0 0',background:m.cur?'var(--hero)':'#EDE4FF',backgroundSize:m.cur?'200%':undefined,animation:m.cur?'GS 5s ease infinite':undefined,height:`${Math.max(m.tot/mxM*54,3)}px`,transition:'height .9s cubic-bezier(.23,1,.32,1)'}}/>

      <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}}>
        <h3 class="serif" style=${{fontSize:17,fontWeight:700}}>Récentes ✨</h3>
        <button onClick=${()=>go('txs')} style=${{background:'none',border:'none',color:'var(--rose)',fontWeight:800,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Tout voir →</button>
      </div>
      ${txs.length===0?H`<div class="card" style=${{padding:'34px 18px',textAlign:'center'}}>
        <div style=${{fontSize:54,marginBottom:9,animation:'FL 3s ease-in-out infinite',display:'block'}}>🌸</div>
        <div style=${{fontSize:14,fontWeight:800,color:'var(--text)',marginBottom:5}}>Prête à commencer ?</div>
        <div style=${{fontSize:13,color:'var(--muted)',marginBottom:16,lineHeight:1.6,fontWeight:600}}>Ajoute ta première dépense !</div>
      </div>`:H`<div class="card" style=${{padding:'3px 15px'}}>
        ${[...txs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(t=>{const c=gC(t.cat);return H`<div key=${t.id} class="tx">
          <div class="cati" style=${{background:c.g,boxShadow:`0 2px 9px ${c.c}33`}}><span style=${{filter:'brightness(0) invert(1)'}}>${c.e}</span></div>
          <div style=${{flex:1,minWidth:0}}>
            <div style=${{fontSize:13.5,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${t.desc||c.l}${t.recur?H`<span style=${{fontSize:11,marginLeft:4}}>🔁</span>`:''}</div>
            <div style=${{fontSize:11,color:'var(--muted)',fontWeight:600}}>${c.l} · ${fd(t.date)}</div>
          </div>
          <div class="serif" style=${{fontSize:14.5,fontWeight:700,color:t.type==='income'?'var(--mint)':'var(--rose)',flexShrink:0}}>${t.type==='income'?'+':'-'}${fa(t.amount,cur)}</div>
        </div>`;})}</div>`}
    </div>
    <div style=${{height:12}}/>
  </div>`;
};

// ── TRANSACTIONS ──
const Txs=({txs,cur,onEdit,onDel})=>{
  const [filt,setFilt]=useState('all');
  const [catF,setCatF]=useState('all');
  const [q,setQ]=useState('');
  const shown=txs.filter(t=>filt==='all'||t.type===filt).filter(t=>catF==='all'||t.cat===catF).filter(t=>!q||[t.desc,gC(t.cat).l,t.note].filter(Boolean).join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
  const grp=shown.reduce((a,t)=>{const k=dk(t.date);if(!a[k])a[k]=[];a[k].push(t);return a},{});
  const tot=shown.reduce((s,t)=>s+(t.type==='expense'?-1:1)*t.amount,0);
  return H`<div class="pg">
    <h1 class="serif" style=${{fontSize:26,fontWeight:700,marginBottom:3}}>Mes transactions</h1>
    <p style=${{fontSize:13,color:'var(--muted)',fontWeight:700,marginBottom:14}}>${txs.length} total · <span style=${{color:tot>=0?'var(--mint)':'var(--rose)'}}>${tot>=0?'+':''}${fa(tot,cur)}</span></p>
    <div class="seg" style=${{marginBottom:11}}>
      ${[['all','Tout'],['expense','💸 Dépenses'],['income','💰 Revenus']].map(([v,l])=>H`<button key=${v} class=${`sb ${filt===v?'on':''}`} onClick=${()=>setFilt(v)}>${l}</button>`)}
    </div>
    <div style=${{position:'relative',marginBottom:11}}>
      <span style=${{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:16,color:'var(--faint)',pointerEvents:'none'}}>🔍</span>
      <input class="inp" value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Rechercher…" style=${{paddingLeft:36,paddingTop:11,paddingBottom:11}}/>
    </div>
    <div style=${{display:'flex',gap:7,overflowX:'auto',paddingBottom:6,marginBottom:13}}>
      <button class=${`chip ${catF==='all'?'on':''}`} onClick=${()=>setCatF('all')}>Tout</button>
      ${CATS.filter(c=>txs.some(t=>t.cat===c.k)).map(c=>H`<button key=${c.k} class=${`chip ${catF===c.k?'on':''}`} onClick=${()=>setCatF(c.k)}>${c.e} ${c.l}</button>`)}
    </div>
    ${shown.length===0?H`<div style=${{textAlign:'center',padding:'50px 0'}}>
      <div style=${{fontSize:42,marginBottom:9}}>🔍</div>
      <div style=${{fontSize:14,fontWeight:700,color:'var(--muted)'}}>Aucune transaction</div>
    </div>`:Object.entries(grp).map(([day,items])=>H`<div key=${day}>
      <div class="dsep">${day}</div>
      <div class="card" style=${{padding:'3px 15px',marginBottom:7}}>
        ${items.map(t=>{const c=gC(t.cat);return H`<div key=${t.id} class="tx" onClick=${()=>onEdit(t)}>
          <div class="cati" style=${{background:c.g,boxShadow:`0 2px 9px ${c.c}33`}}><span style=${{filter:'brightness(0) invert(1)'}}>${c.e}</span></div>
          <div style=${{flex:1,minWidth:0}}>
            <div style=${{fontSize:13.5,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${t.desc||c.l}${t.recur?H`<span style=${{fontSize:11,marginLeft:4}}>🔁</span>`:''}</div>
            <div style=${{fontSize:11,color:'var(--muted)',fontWeight:600}}>${c.l}${t.note?` · ${t.note}`:''}</div>
          </div>
          <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3,flexShrink:0}}>
            <div class="serif" style=${{fontSize:14.5,fontWeight:700,color:t.type==='income'?'var(--mint)':'var(--rose)'}}>${t.type==='income'?'+':'-'}${fa(t.amount,cur)}</div>
            <button onClick=${e=>{e.stopPropagation();onDel(t.id)}} style=${{background:'none',border:'none',cursor:'pointer',fontSize:13,color:'var(--faint)',padding:0,lineHeight:1}}>🗑</button>
          </div>
        </div>`;})}</div>`)}
    <div style=${{height:6}}/>
  </div>`;
};

// ── BUDGET ──
const Budget=({txs,budgets,cur,onSave})=>{
  const [ec,setEc]=useState(null);[ec,setEc];
  const [ea,setEa]=useState('');
  const mExp=txs.filter(t=>t.type==='expense'&&itm(t.date));
  const sp=mExp.reduce((a,t)=>{a[t.cat]=(a[t.cat]||0)+t.amount;return a},{});
  const tB=Object.values(budgets).reduce((s,v)=>s+v,0);
  const tS=Object.values(sp).reduce((s,v)=>s+v,0);
  const pT=tB>0?Math.min(tS/tB*100,100):0;
  return H`<div class="pg">
    <h1 class="serif" style=${{fontSize:26,fontWeight:700,marginBottom:3}}>Budget mensuel 📊</h1>
    <p style=${{fontSize:13,color:'var(--muted)',fontWeight:700,marginBottom:14}}>Appuie pour définir un budget</p>
    ${tB>0&&H`<div class="card" style=${{padding:'15px 16px',marginBottom:14,background:'var(--hero)',backgroundSize:'200%',animation:'GS 6s ease infinite',border:'none',boxShadow:'0 7px 24px var(--roseG)'}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:9}}>
        <div>
          <div style=${{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.68)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:3}}>Budget global</div>
          <div class="serif" style=${{fontSize:22,fontWeight:700,color:'#fff'}}>${fa(tS,cur)} <span style=${{fontSize:13,opacity:.65}}>/ ${fa(tB,cur)}</span></div>
        </div>
        <div class="serif" style=${{fontSize:22,fontWeight:700,color:'rgba(255,255,255,.9)'}}>${Math.round(pT)}%</div>
      </div>
      <div style=${{background:'rgba(255,255,255,.18)',borderRadius:50,height:7}}>
        <div style=${{background:'rgba(255,255,255,.88)',borderRadius:50,height:7,width:`${pT}%`,transition:'width .9s ease'}}/>
      </div>
    </div>`}
    <div style=${{display:'flex',flexDirection:'column',gap:9}}>
      ${CATS.filter(c=>c.t==='e').map((c,i)=>{
        const spent=sp[c.k]||0,bud=budgets[c.k]||0,pct=bud>0?Math.min(spent/bud*100,100):0,over=bud>0&&spent>bud;
        return H`<div key=${c.k} class="card" style=${{padding:'12px 14px',cursor:'pointer',animation:`FU .35s ease ${i*20}ms both`}} onClick=${()=>{setEc(c.k);setEa(bud?String(bud):'');}}>
          <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:bud?9:0}}>
            <div style=${{width:38,height:38,borderRadius:11,background:c.g,display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0,boxShadow:`0 2px 8px ${c.c}33`}}><span style=${{filter:'brightness(0) invert(1)'}}>${c.e}</span></div>
            <div style=${{flex:1}}>
              <div style=${{fontSize:13.5,fontWeight:700}}>${c.l}</div>
              <div style=${{fontSize:11,fontWeight:700,color:over?'var(--rose)':'var(--muted)'}}>
                ${bud>0?`${fa(spent,cur)} / ${fa(bud,cur)}${over?' ⚠️ dépassé!':''}`:H`<span style=${{color:'var(--faint)'}}>Appuie pour définir</span>`}
              </div>
            </div>
            ${bud>0&&H`<div style=${{fontSize:12,fontWeight:800,color:over?'var(--rose)':'var(--violet)'}}>${Math.round(pct)}%</div>`}
            <span style=${{color:'var(--faint)',fontSize:14}}>›</span>
          </div>
          ${bud>0&&H`<div class="pt"><div class="pf" style=${{width:`${pct}%`,background:over?'linear-gradient(90deg,var(--rose),var(--peach))':c.g}}/></div>`}
        </div>`;
      })}
    </div>
    ${ec&&H`<${Modal} title=${`${gC(ec).e} ${gC(ec).l}`} onClose=${()=>setEc(null)} onSave=${()=>{onSave(ec,parseFloat(ea)||0);setEc(null);}} saveLabel="Enregistrer ✓">
      <${Inp} label="Budget mensuel" value=${ea} onChange=${setEa} type="number" pre=${cur} placeholder="150"/>
      <button class="btn btn-danger btn-sm" style=${{width:'100%',marginBottom:6}} onClick=${()=>{onSave(ec,0);setEc(null);}}>Supprimer ce budget</button>
    </${Modal}>`}

const Chat=({txs,savings,budgets,cur,apiKey,name})=>{
  const [msgs,setMsgs]=useState(()=>LS.g('sb-chat',[]));
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const endR=useRef(null);
  const inpR=useRef(null);
  const mt=txs.filter(t=>itm(t.date));
  const inc=mt.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=mt.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const topC=Object.entries(mt.filter(t=>t.type==='expense').reduce((a,t)=>{a[t.cat]=(a[t.cat]||0)+t.amount;return a},{})).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${gC(k).e}${gC(k).l}:${v.toFixed(0)}${cur}`).join(', ');
  const saved=savings.reduce((s,g)=>s+g.current,0);
  const sys=`Tu es l'assistante IA de Salbath, une app finances girly et moderne. Tu t'appelles Salbath AI. Tu es chaleureuse, bienveillante, experte en finances. Tu analyses les données de ${name} et donnes des conseils personnalisés, positifs, concrets. Français, emojis, 3-4 lignes max.

Finances de ${name} ce mois : revenus ${fa(inc,cur)}, dépenses ${fa(exp,cur)}, solde ${fa(inc-exp,cur)}, top dépenses: ${topC||'aucune'}, épargne totale: ${fa(saved,cur)}, objectifs: ${savings.map(g=>`${g.emoji}${g.name}(${g.current.toFixed(0)}/${g.target.toFixed(0)}${cur})`).join(', ')||'aucun'}, ${mt.length} transactions ce mois.`;

  useEffect(()=>{endR.current?.scrollIntoView({behavior:'smooth'})},[msgs,busy]);
  useEffect(()=>{LS.s('sb-chat',msgs.slice(-40))},[msgs]);

  const send=async()=>{
    const txt=input.trim();if(!txt||busy)return;
    const um={role:'user',content:txt,id:mkId()};
    const nm=[...msgs,um];setMsgs(nm);setInput('');setBusy(true);
    if(!apiKey){
      setBusy(false);
      setMsgs(m=>[...m,{role:'assistant',content:`Coucou ${name} 💖 ! Pour utiliser Salbath AI, va dans l'onglet 👩 Profil → colle ta clé API Anthropic. Tu peux la créer sur console.anthropic.com — c'est gratuit pour commencer 🌸`,id:mkId()}]);
      return;
    }
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-allow-any-origin':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,system:sys,messages:nm.map(m=>({role:m.role,content:m.content}))})});
      const d=await r.json();
      setMsgs(m=>[...m,{role:'assistant',content:d.content?.[0]?.text||'Erreur de réponse 💔',id:mkId()}]);
    }catch{setMsgs(m=>[...m,{role:'assistant',content:'Oups ! Erreur réseau. Vérifie ta connexion et ta clé API 💫',id:mkId()}]);}
    setBusy(false);
  };
  const SUGG=['📊 Analyse mes dépenses du mois','💰 Comment épargner plus ?','🔍 Où est-ce que je gaspille ?','✨ Conseils pour mes objectifs'];
  return H`<div style=${{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
    <div style=${{background:'var(--hero)',backgroundSize:'200%',animation:'GS 6s ease infinite',padding:'calc(var(--ST) + 12px) 16px 15px',flexShrink:0,boxShadow:'0 4px 20px var(--roseG)'}}>
      <div style=${{display:'flex',alignItems:'center',gap:11}}>
        <div style=${{width:42,height:42,borderRadius:13,background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:21}}>💖</div>
        <div style=${{flex:1}}>
          <div style=${{fontSize:15,fontWeight:900,color:'#fff'}}>Salbath AI ✨</div>
          <div style=${{fontSize:10.5,color:'rgba(255,255,255,.68)',fontWeight:600}}>Ton assistante financière IA</div>
        </div>
        <button onClick=${()=>setMsgs([])} style=${{background:'rgba(255,255,255,.14)',border:'none',borderRadius:9,padding:'6px 11px',color:'#fff',cursor:'pointer',fontSize:12,fontWeight:800,fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>Effacer</button>
      </div>
    </div>
    <div style=${{flex:1,overflowY:'auto',padding:'14px 14px 0',display:'flex',flexDirection:'column',gap:11}}>
      ${msgs.length===0&&H`<div style=${{textAlign:'center',padding:'14px 0 6px'}}>
        <div style=${{fontSize:50,marginBottom:6,animation:'FL 3s ease-in-out infinite',display:'block'}}>🌸</div>
        <div style=${{fontSize:15,fontWeight:800,marginBottom:3}}>Coucou ${name} ! 👋</div>
        <div style=${{fontSize:13,color:'var(--muted)',lineHeight:1.65,marginBottom:16,fontWeight:600}}>Je suis Salbath AI, ton assistante<br/>financière personnelle !</div>
        <div style=${{display:'flex',flexDirection:'column',gap:7}}>
          ${SUGG.map(s=>H`<button key=${s} onClick=${()=>setInput(s)} style=${{background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:13,padding:'10px 13px',cursor:'pointer',fontSize:13,fontWeight:700,color:'var(--violet)',textAlign:'left',fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>${s}</button>`)}
        </div>
      </div>`}
      ${msgs.map((m,i)=>H`<div key=${m.id||i} style=${{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',alignItems:'flex-end',gap:7}}>
        ${m.role==='assistant'&&H`<div style=${{width:28,height:28,borderRadius:9,background:'var(--hero)',backgroundSize:'200%',animation:'GS 5s ease infinite',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>💖</div>`}
        <div class=${`bub ${m.role==='assistant'?'bub-ai':'bub-u'}`}>${m.content}</div>
      </div>`)}
      ${busy&&H`<div style=${{display:'flex',alignItems:'flex-end',gap:7}}>
        <div style=${{width:28,height:28,borderRadius:9,background:'var(--hero)',backgroundSize:'200%',animation:'GS 5s ease infinite',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>💖</div>
        <div class="bub bub-ai" style=${{display:'flex',gap:5,alignItems:'center',padding:'12px 16px'}}>
          <div class="tdot"/><div class="tdot"/><div class="tdot"/>
        </div>
      </div>`}
      <div ref=${endR}/>
    </div>
    <div style=${{padding:'9px 13px',paddingBottom:`calc(var(--SB) + 80px)`,background:'var(--card)',borderTop:'1px solid var(--border)',display:'flex',gap:7,flexShrink:0}}>
      <input ref=${inpR} class="inp" value=${input} onInput=${e=>setInput(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&!e.shiftKey&&(e.preventDefault(),send())} placeholder="Parle à Salbath AI…" style=${{flex:1,padding:'11px 13px',fontSize:13.5}}/>
      <button onClick=${send} style=${{width:44,height:44,borderRadius:12,background:busy||!input.trim()?'var(--border)':'var(--hero)',backgroundSize:'200%',animation:(!busy&&input.trim())?'GS 5s ease infinite':undefined,border:'none',color:'#fff',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'background .2s',WebkitTapHighlightColor:'transparent'}}>
        ${busy?H`<div style=${{width:16,height:16,borderRadius:'50%',border:'2.5px solid rgba(255,255,255,.3)',borderTopColor:'#fff',animation:'SK .7s linear infinite'}}/>`:H`→`}
      </button>
    </div>
  </div>`;
};

      ${[{l:'Dépenses',v:fa(mExp,cur),c:'var(--rose)'},{l:'Revenus',v:fa(mInc,cur),c:'var(--mint)'},{l:'Épargne',v:fa(saved,cur),c:'var(--gold)'},{l:'Transactions',v:tot,c:'var(--violet)'}].map(s=>H`<div key=${s.l} class="card" style=${{padding:'12px 13px'}}>
        <div style=${{fontSize:9.5,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>${s.l}</div>
        <div class="serif" style=${{fontSize:18,fontWeight:700,color:s.c,lineHeight:1}}>${s.v}</div>
      </div>`)}
    </div>

    <div class="card" style=${{padding:'15px 16px',marginBottom:11}}>
      <h3 style=${{fontSize:11,fontWeight:800,color:'var(--muted)',marginBottom:13,textTransform:'uppercase',letterSpacing:'.08em'}}>Mon profil</h3>
      <${Inp} label="Prénom" value=${name} onChange=${setName} placeholder="Ton prénom"/>
      <${Sel} label="Devise" value=${cur} onChange=${setCur} opts=${CURS.map(c=>({v:c.s,l:`${c.s} — ${c.l}`}))}/>
      <button class="btn btn-hero btn-sm" style=${{width:'100%'}} onClick=${()=>onSave({name,currency:cur,apiKey:key})}>Enregistrer ✓</button>
    </div>

    <div class="card" style=${{padding:'15px 16px',marginBottom:11}}>
      <h3 style=${{fontSize:11,fontWeight:800,color:'var(--muted)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.08em'}}>Salbath AI — Clé Anthropic</h3>
      <p style=${{fontSize:12,color:'var(--muted)',marginBottom:12,lineHeight:1.6,fontWeight:600}}>Obtiens ta clé sur <strong style=${{color:'var(--violet)'}}>console.anthropic.com</strong> → API Keys. Stockée uniquement sur cet appareil.</p>
      <div class="iw">
        <label class="lbl">Clé API</label>
        <div style=${{position:'relative'}}>
          <input class="inp" type=${showK?'text':'password'} value=${key} onInput=${e=>setKey(e.target.value)} placeholder="sk-ant-…"/>
          <button onClick=${()=>setShowK(v=>!v)} style=${{position:'absolute',right:11,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:17,lineHeight:1,WebkitTapHighlightColor:'transparent'}}>${showK?'🙈':'👁️'}</button>
        </div>
      </div>
      <button class="btn btn-hero btn-sm" style=${{width:'100%'}} onClick=${()=>onSave({name,currency:cur,apiKey:key})}>Enregistrer la clé ✓</button>
    </div>

    <div class="card" style=${{padding:'15px 16px',marginBottom:11}}>
      <h3 style=${{fontSize:11,fontWeight:800,color:'var(--muted)',marginBottom:11,textTransform:'uppercase',letterSpacing:'.08em'}}>Statistiques</h3>
      ${[['Transactions totales',tot],['Objectifs d\'épargne',savings.length],['Wishlist',wishlist.length],['Objectifs atteints',savings.filter(g=>g.current>=g.target).length]].map(([l,v])=>H`<div key=${l} style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
        <span style=${{fontSize:13,fontWeight:700,color:'var(--muted)'}}>${l}</span>
        <span class="serif" style=${{fontSize:16,fontWeight:700}}>${v}</span>
      </div>`)}
    </div>

    <div class="card" style=${{padding:'15px 16px',marginBottom:16}}>
      <h3 style=${{fontSize:11,fontWeight:800,color:'#C81A5E',marginBottom:11,textTransform:'uppercase',letterSpacing:'.08em'}}>Zone danger 🚨</h3>
      <button class="btn btn-danger" style=${{width:'100%',fontSize:14}} onClick=${()=>{if(confirm('Supprimer TOUTES les données ? Cette action est irréversible !'))onClear();}}>Réinitialiser toutes les données</button>
    </div>
  </div>`;
};

// ── APP ──
function App(){
  const [cfg,setCfg]=useState(()=>LS.g('sb-cfg',null));
  const [txs,setTxs]=useState(()=>LS.g('sb-txs',[]));
  const [bud,setBud]=useState(()=>LS.g('sb-bud',{}));
  const [sav,setSav]=useState(()=>LS.g('sb-sav',[]));
  const [wsh,setWsh]=useState(()=>LS.g('sb-wsh',[]));
  const [ph,setPh]=useState(()=>LS.g('sb-ph',null));
  const [page,setPage]=useState('home');
  const [addOpen,setAddOpen]=useState(false);
  const [editTx,setEditTx]=useState(null);
  const [ak,setAk]=useState(0);

  const cur=cfg?.currency||'€';
  window._cur=cur;

  useEffect(()=>{LS.s('sb-txs',txs)},[txs]);
  useEffect(()=>{LS.s('sb-bud',bud)},[bud]);
  useEffect(()=>{LS.s('sb-sav',sav)},[sav]);
  useEffect(()=>{LS.s('sb-wsh',wsh)},[wsh]);
  useEffect(()=>{LS.s('sb-cfg',cfg)},[cfg]);
  useEffect(()=>{if(ph)LS.s('sb-ph',ph)},[ph]);

  const go=p=>{setPage(p);setAk(k=>k+1)};
  if(!cfg)return H`<${Onboarding} onDone=${s=>setCfg(s)}/>`;

  const saveTx=t=>{setTxs(p=>{const i=p.findIndex(x=>x.id===t.id);return i>=0?p.map(x=>x.id===t.id?t:x):[...p,t]});setEditTx(null);};
  const delTx=id=>setTxs(p=>p.filter(t=>t.id!==id));
  const saveBud=(k,v)=>setBud(p=>{const n={...p};if(!v)delete n[k];else n[k]=v;return n});
  const saveGoal=g=>setSav(p=>{const i=p.findIndex(x=>x.id===g.id);return i>=0?p.map(x=>x.id===g.id?g:x):[...p,g]});
  const delGoal=id=>setSav(p=>p.filter(g=>g.id!==id));
  const contrib=(id,a)=>setSav(p=>p.map(g=>g.id===id?{...g,current:Math.min(g.current+a,g.target)}:g));
  const saveWish=w=>setWsh(p=>{const i=p.findIndex(x=>x.id===w.id);return i>=0?p.map(x=>x.id===w.id?w:x):[...p,w]});
  const delWish=id=>setWsh(p=>p.filter(w=>w.id!==id));
  const togWish=id=>setWsh(p=>p.map(w=>w.id===id?{...w,done:!w.done}:w));
  const clearAll=()=>{setTxs([]);setBud({});setSav([]);setWsh([]);setPh(null);LS.s('sb-chat',[]);};

  const NAV=[
    {id:'home',ic:'🏠',lb:'Accueil'},
    {id:'txs',ic:'💳',lb:'Dépenses'},
    {id:'budget',ic:'📊',lb:'Budget'},
    {id:'savings',ic:'💎',lb:'Épargne'},
    {id:'chat',ic:'💬',lb:'IA'},
    {id:'profile',ic:null,lb:'Profil'},
  ];

  return H`<div id="app" style=${{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
    <div key=${ak} class=${`screen has-nav`} style=${{flex:1,paddingTop:page==='chat'||page==='profile'?0:'var(--ST)'}}>
      <div style=${{animation:'FU .38s ease both'}}>
        ${page==='home'&&H`<${Home} txs=${txs} savings=${sav} name=${cfg.name} cur=${cur} photo=${ph} go=${go}/>`}
        ${page==='txs'&&H`<${Txs} txs=${txs} cur=${cur} onEdit=${t=>{setEditTx(t);setAddOpen(true);}} onDel=${delTx}/>`}
        ${page==='budget'&&H`<${Budget} txs=${txs} budgets=${bud} cur=${cur} onSave=${saveBud}/>`}
        ${page==='savings'&&H`<${Savings} savings=${sav} wishlist=${wsh} cur=${cur} onSaveGoal=${saveGoal} onDelGoal=${delGoal} onContrib=${contrib} onSaveWish=${saveWish} onDelWish=${delWish} onToggleWish=${togWish}/>`}
        ${page==='chat'&&H`<${Chat} txs=${txs} savings=${sav} budgets=${bud} cur=${cur} apiKey=${cfg.apiKey} name=${cfg.name}/>`}
        ${page==='profile'&&H`<${Profile} settings=${cfg} photo=${ph} txs=${txs} savings=${sav} wishlist=${wsh} onSave=${s=>{setCfg(p=>({...p,...s}));}} onPhoto=${setPh} onClear=${clearAll}/>`}
      </div>
    </div>

    <nav class="bnav">
      ${NAV.map(n=>H`<button key=${n.id} class=${`nb ${page===n.id?'on':''}`} onClick=${()=>go(n.id)}>
        <span class="ni" style=${{overflow:'hidden',borderRadius:n.id==='profile'?'50%':undefined,width:n.id==='profile'?24:undefined,height:n.id==='profile'?24:undefined,display:'flex',alignItems:'center',justifyContent:'center'}}>
          ${n.id==='profile'?(ph?H`<img src=${ph} style=${{width:24,height:24,objectFit:'cover',borderRadius:'50%'}} alt=""/>`:H`<span style=${{fontSize:20}}>👩</span>`):H`<span style=${{fontSize:20}}>${n.ic}</span>`}
        </span>
        <span class="nl">${n.lb}</span>
      </button>`)}
    </nav>

    ${['home','txs','budget'].includes(page)&&H`<button class="fab" onClick=${()=>{setEditTx(null);setAddOpen(true);}}>＋</button>`}
    ${(addOpen||editTx)&&H`<${TxForm} onClose=${()=>{setAddOpen(false);setEditTx(null);}} onSave=${saveTx} init=${editTx}/>`}
  </div>`;
}

render(H`<${App}/>`,document.getElementById('app'));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
