<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Finella 💖</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E0176C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finella">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose:#E0176C; --rose2:#FF5BA3; --rose-light:#FFE8F3; --rose-glow:rgba(224,23,108,.28);
      --violet:#8B47E8; --violet-light:#EEE4FF;
      --peach:#FF7D5C; --peach-light:#FFEDE7;
      --mint:#00CFA8; --mint-light:#CDFCF3;
      --gold:#F0A500; --gold-light:#FEF5D9;
      --sky:#4FACFE; --sky-light:#E0F2FF;
      --bg:#FFF2F8; --surface:#FFFFFF;
      --text:#1C0A28; --muted:#9474B4; --light:#C4A8D8;
      --border:rgba(139,71,232,.11);
      --hero:linear-gradient(135deg,#E0176C 0%,#8B47E8 55%,#FF7D5C 100%);
      --hero2:linear-gradient(135deg,#00CFA8 0%,#4FACFE 100%);
      --hero3:linear-gradient(135deg,#F0A500 0%,#FF7D5C 100%);
      --hero4:linear-gradient(135deg,#8B47E8 0%,#E0176C 100%);
      --sidebar:#160828;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:'Nunito',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    .serif{font-family:'Cormorant Garamond',Georgia,serif}
    ::-webkit-scrollbar{display:none}
    input,select,textarea,button{font-family:inherit}

    @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--rose-glow)}60%{box-shadow:0 0 0 18px transparent}}
    @keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    @keyframes ringIn{from{stroke-dashoffset:var(--circ)}to{stroke-dashoffset:var(--end)}}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

    .fu{animation:fadeUp .4s cubic-bezier(.23,1,.32,1) both}
    .fi{animation:fadeIn .3s ease both}
    .si{animation:scaleIn .3s cubic-bezier(.23,1,.32,1) both}
    .pi{animation:popIn .4s cubic-bezier(.23,1,.32,1) both}

    #root{display:flex;flex-direction:column;position:relative}
    .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(84px + var(--safe-bottom))}
    .screen.no-nav{padding-bottom:0}

    .card{background:var(--surface);border-radius:24px;box-shadow:0 4px 20px rgba(139,71,232,.09);border:1.5px solid var(--border)}
    .glass{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.25)}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:18px;font-size:15px;font-weight:800;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;font-family:inherit;letter-spacing:.01em}
    .btn:active{transform:scale(.94)}
    .btn-rose{background:var(--hero);background-size:200% 200%;animation:gradShift 5s ease infinite;color:#fff;box-shadow:0 8px 26px var(--rose-glow)}
    .btn-ghost{background:rgba(139,71,232,.07);color:var(--muted);border:1.5px solid var(--border)}
    .btn-danger{background:#FFF0F5;color:#C81A5E;border:1.5px solid #FFD6E8}
    .btn-sm{padding:9px 18px;font-size:13px;border-radius:13px}
    .btn-xs{padding:7px 13px;font-size:12px;border-radius:10px}

    .inp{width:100%;padding:14px 16px;font-size:15px;font-weight:600;color:var(--text);background:#FBF4FF;border:2px solid var(--border);border-radius:16px;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;font-family:inherit}
    .inp:focus{border-color:var(--violet);background:#fff;box-shadow:0 0 0 4px rgba(139,71,232,.1)}
    .lbl{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
    .inp-wrap{margin-bottom:16px}

    .bot-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(139,71,232,.08);display:flex;align-items:stretch;padding-bottom:var(--safe-bottom);z-index:100;box-shadow:0 -4px 24px rgba(139,71,232,.08)}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 0 8px;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;font-family:inherit}
    .nav-btn .nicon{font-size:21px;line-height:1;transition:transform .22s cubic-bezier(.23,1,.32,1)}
    .nav-btn .nlabel{font-size:9.5px;font-weight:800;color:var(--light);transition:color .2s;letter-spacing:.03em;text-transform:uppercase}
    .nav-btn.active .nlabel{color:var(--rose)}
    .nav-btn.active .nicon{transform:scale(1.18)}
    .nav-btn::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:3px;background:var(--hero);border-radius:0 0 4px 4px;transition:width .28s cubic-bezier(.23,1,.32,1);background-size:200% 200%;animation:gradShift 5s ease infinite}
    .nav-btn.active::before{width:36px}

    .fab{position:fixed;bottom:calc(var(--safe-bottom) + 76px);right:18px;width:58px;height:58px;border-radius:50%;background:var(--hero);background-size:200% 200%;animation:gradShift 5s ease infinite,pulse 2.5s ease-in-out infinite;color:#fff;border:none;font-size:26px;cursor:pointer;z-index:101;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 8px 28px var(--rose-glow)}
    .fab:active{transform:scale(.88)}

    .overlay{position:fixed;inset:0;background:rgba(28,10,40,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:200;animation:fadeIn .22s ease;display:flex;align-items:flex-end;justify-content:center}
    .sheet{background:var(--surface);border-radius:30px 30px 0 0;width:100%;max-height:94vh;overflow-y:auto;animation:slideUp .36s cubic-bezier(.23,1,.32,1);padding-bottom:calc(20px + var(--safe-bottom))}
    .sheet-handle{width:44px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 18px}

    .status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:50px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
    .cat-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

    .seg{display:flex;background:#F2EAFF;border-radius:14px;padding:4px;gap:4px}
    .seg-btn{flex:1;padding:9px 4px;border:none;border-radius:11px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:all .2s;color:var(--muted);background:transparent;white-space:nowrap;letter-spacing:.01em}
    .seg-btn.active{background:#fff;color:var(--text);box-shadow:0 2px 10px rgba(139,71,232,.14)}

    .prog-track{background:#EFE6FF;border-radius:50px;height:8px;overflow:hidden}
    .prog-fill{height:100%;border-radius:50px;transition:width .9s cubic-bezier(.23,1,.32,1)}

    .chip{padding:7px 14px;border-radius:50px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:transparent;color:var(--muted);-webkit-tap-highlight-color:transparent;white-space:nowrap;font-family:inherit;transition:all .2s}
    .chip.active{border-color:var(--rose);background:var(--rose-light);color:var(--rose)}
    .chip:active{transform:scale(.94)}

    .tx-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
    .tx-row:last-child{border-bottom:none}
    .tx-row:active{opacity:.65}
    .p-screen{padding:18px 16px}
    .date-sep{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:14px 0 8px}

    .ring-bg{fill:none;stroke:#EEE4FF;stroke-width:6}
    .ring-fill{fill:none;stroke-width:6;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.23,1,.32,1) both}

    .chat-bubble{max-width:82%;padding:12px 16px;border-radius:20px;font-size:14px;font-weight:500;line-height:1.7;animation:msgIn .3s ease both}
    .bubble-ai{background:var(--surface);color:var(--text);border-radius:4px 20px 20px 20px;box-shadow:0 2px 14px rgba(139,71,232,.1)}
    .bubble-user{background:var(--hero);background-size:200% 200%;animation:gradShift 5s ease infinite,msgIn .3s ease both;color:#fff;border-radius:20px 4px 20px 20px}
    .tdot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s ease-in-out infinite}
    .tdot:nth-child(2){animation-delay:.2s}
    .tdot:nth-child(3){animation-delay:.4s}

    .wish-card{background:var(--surface);border-radius:18px;border:1.5px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:13px;-webkit-tap-highlight-color:transparent}

    .avatar-ring{width:80px;height:80px;border-radius:50%;background:var(--hero);background-size:200% 200%;animation:gradShift 6s ease infinite;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px var(--rose-glow);position:relative;flex-shrink:0}
    .avatar-img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #fff}
    .avatar-placeholder{font-size:32px;line-height:1}

    .stat-pill{background:var(--surface);border-radius:16px;padding:13px 15px;border:1.5px solid var(--border);display:flex;flex-direction:column;gap:4px}
    .notif-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex-shrink:0;box-shadow:0 0 0 2px var(--rose-light)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import{h,render,Fragment}from'https://esm.sh/preact@10.19.3';
import{useState,useEffect,useCallback,useRef,useMemo}from'https://esm.sh/preact@10.19.3/hooks';
import htm from'https://esm.sh/htm@3.1.1';
const html=htm.bind(h);

const CATS=[
  {k:'shopping',   l:'Shopping',        e:'🛍️',c:'#E0176C',bg:'#FFE8F3',g:'linear-gradient(135deg,#E0176C,#FF7D5C)',t:'expense'},
  {k:'courses',    l:'Courses',          e:'🛒',c:'#00B894',bg:'#CDFCF3',g:'linear-gradient(135deg,#00CFA8,#4FACFE)',t:'expense'},
  {k:'restaurant', l:'Restaurant',       e:'🍽️',c:'#FF7D5C',bg:'#FFEDE7',g:'linear-gradient(135deg,#FF7D5C,#F0A500)',t:'expense'},
  {k:'logement',   l:'Logement',         e:'🏠',c:'#8B47E8',bg:'#EEE4FF',g:'linear-gradient(135deg,#8B47E8,#B57FFF)',t:'expense'},
  {k:'sante',      l:'Santé',            e:'💊',c:'#00CFA8',bg:'#CDFCF3',g:'linear-gradient(135deg,#00CFA8,#38BDF8)',t:'expense'},
  {k:'transport',  l:'Transport',        e:'🚗',c:'#4FACFE',bg:'#E0F2FF',g:'linear-gradient(135deg,#4FACFE,#818CF8)',t:'expense'},
  {k:'beaute',     l:'Beauté',           e:'💄',c:'#F472B6',bg:'#FFE0F5',g:'linear-gradient(135deg,#F472B6,#E879F9)',t:'expense'},
  {k:'loisirs',    l:'Loisirs',          e:'🎬',c:'#F0A500',bg:'#FEF5D9',g:'linear-gradient(135deg,#F0A500,#FF7D5C)',t:'expense'},
  {k:'abos',       l:'Abonnements',      e:'📱',c:'#818CF8',bg:'#E8EAFF',g:'linear-gradient(135deg,#818CF8,#8B47E8)',t:'expense'},
  {k:'voyages',    l:'Voyages',          e:'✈️',c:'#06B6D4',bg:'#CDFAFF',g:'linear-gradient(135deg,#06B6D4,#38BDF8)',t:'expense'},
  {k:'soins',      l:'Soins & Bien-être',e:'🧴',c:'#EC4899',bg:'#FDE8F5',g:'linear-gradient(135deg,#EC4899,#F472B6)',t:'expense'},
  {k:'sport',      l:'Sport & Fitness',  e:'🏋️',c:'#10B981',bg:'#D1FAE5',g:'linear-gradient(135deg,#10B981,#34D399)',t:'expense'},
  {k:'enfants',    l:'Enfants',          e:'🧸',c:'#FCA5A5',bg:'#FEE2E2',g:'linear-gradient(135deg,#FCA5A5,#F472B6)',t:'expense'},
  {k:'cadeaux',    l:'Cadeaux',          e:'🎁',c:'#F59E0B',bg:'#FEF3C7',g:'linear-gradient(135deg,#F59E0B,#FF7D5C)',t:'expense'},
  {k:'education',  l:'Éducation',        e:'📚',c:'#6366F1',bg:'#E0E1FF',g:'linear-gradient(135deg,#6366F1,#8B47E8)',t:'expense'},
  {k:'autre',      l:'Autre',            e:'💸',c:'#94A3B8',bg:'#E8EDF2',g:'linear-gradient(135deg,#94A3B8,#CBD5E1)',t:'expense'},
  {k:'salaire',    l:'Salaire',          e:'💼',c:'#10B981',bg:'#D1FAE5',g:'linear-gradient(135deg,#10B981,#06B6D4)',t:'income'},
  {k:'freelance',  l:'Freelance',        e:'💻',c:'#34D399',bg:'#CCFCE7',g:'linear-gradient(135deg,#34D399,#4FACFE)',t:'income'},
  {k:'remb',       l:'Remboursement',    e:'💰',c:'#F59E0B',bg:'#FEF3C7',g:'linear-gradient(135deg,#F59E0B,#FBBF24)',t:'income'},
  {k:'invest',     l:'Investissement',   e:'📈',c:'#3B82F6',bg:'#DBEAFE',g:'linear-gradient(135deg,#3B82F6,#8B47E8)',t:'income'},
  {k:'allocation', l:'Allocation/CAF',   e:'🏛️',c:'#8B47E8',bg:'#EEE4FF',g:'linear-gradient(135deg,#8B47E8,#E0176C)',t:'income'},
];
const CURRENCIES=[{s:'€',l:'EUR — Euro'},{s:'$',l:'USD — Dollar'},{s:'£',l:'GBP — Livre'},{s:'FCFA',l:'XOF — Franc CFA'},{s:'MAD',l:'MAD — Dirham'},{s:'CHF',l:'CHF — Franc Suisse'}];
const PRIOS=[{k:'high',l:'Urgente',c:'#E0176C',bg:'#FFE8F3'},{k:'med',l:'Normale',c:'#F0A500',bg:'#FEF5D9'},{k:'low',l:'Envie',c:'#8B47E8',bg:'#EEE4FF'}];

const getC=k=>CATS.find(c=>c.k===k)||CATS[CATS.length-1];
const getPrio=k=>PRIOS.find(p=>p.k===k)||PRIOS[1];
const mkId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmtAmt=(n,cur)=>{const s=Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');return cur==='FCFA'?`${s} FCFA`:`${cur}${s}`};
const fmtDate=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const dayKey=d=>new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const thisMonth=()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`};
const isThisMonth=d=>d&&d.startsWith(thisMonth());
const LS={
  get:(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch{return def}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
};

const FInput=({label,value,onChange,type='text',placeholder='',prefix})=>html`
  <div class="inp-wrap">
    ${label&&html`<label class="lbl">${label}</label>`}
    <div style=${{position:'relative'}}>
      ${prefix&&html`<span style=${{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',fontSize:15,fontWeight:800,color:'var(--muted)',pointerEvents:'none'}}>${prefix}</span>`}
      <input class="inp" style=${{paddingLeft:prefix?'38px':undefined}} type=${type} value=${value} onInput=${e=>onChange(e.target.value)} placeholder=${placeholder}/>
    </div>
  </div>`;

const FSelect=({label,value,onChange,options})=>html`
  <div class="inp-wrap">
    ${label&&html`<label class="lbl">${label}</label>`}
    <select class="inp" style=${{cursor:'pointer',appearance:'none',backgroundImage:`url("data:image/svg+xml,%3Csvg width='14' height='8' viewBox='0 0 14 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L7 7L13 1' stroke='%239474B4' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E")`,backgroundRepeat:'no-repeat',backgroundPosition:'right 14px center',paddingRight:44}} value=${value} onChange=${e=>onChange(e.target.value)}>
      ${options.map(o=>html`<option value=${o.v}>${o.l}</option>`)}
    </select>
  </div>`;

const Sheet=({title,onClose,children,action,actionLabel='Enregistrer',noPad})=>html`
  <div class="overlay" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div class="sheet">
      <div class="sheet-handle"/>
      <div style=${{padding:'0 20px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid var(--border)',marginBottom:4}}>
        <h2 class="serif" style=${{fontSize:22,fontWeight:700,color:'var(--text)'}}>${title}</h2>
        <button onClick=${onClose} style=${{background:'rgba(139,71,232,.1)',border:'none',borderRadius:'50%',width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:19,color:'var(--muted)',fontFamily:'inherit',lineHeight:1}}>×</button>
      </div>
      <div style=${{padding:noPad?'0':'12px 20px 0'}}>${children}</div>
      ${action&&html`<div style=${{padding:'10px 20px 0',display:'flex',gap:10}}>
        <button onClick=${onClose} class="btn btn-ghost" style=${{flex:1,padding:'13px'}}>Annuler</button>
        <button onClick=${action} class="btn btn-rose" style=${{flex:2,padding:'13px'}}>${actionLabel} ✓</button>
      </div>`}
    </div>
  </div>`;

const DonutChart=({data,size=150,cur})=>{
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total)return html`<div style=${{width:size,height:size,borderRadius:'50%',background:'#EEE4FF',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'var(--muted)',fontWeight:700}}>Vide</div>`;
  const R=56,circ=2*Math.PI*R;let offset=0;
  const segs=data.map(d=>{const pct=d.value/total,len=pct*circ,seg={...d,offset,len};offset+=len;return seg;});
  return html`<div style=${{position:'relative',width:size,height:size,flexShrink:0}}>
    <svg width=${size} height=${size} viewBox="0 0 150 150" style=${{transform:'rotate(-90deg)'}}>
      <circle cx="75" cy="75" r=${R} fill="none" stroke="#EEE4FF" stroke-width="18"/>
      ${segs.map((s,i)=>html`<circle key=${i} cx="75" cy="75" r=${R} fill="none" stroke=${s.c} stroke-width="18"
        stroke-dasharray="${s.len} ${circ}" stroke-dashoffset=${-s.offset} stroke-linecap="round" style=${{opacity:.92}}/>`)}
    </svg>
    <div style=${{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <div style=${{fontSize:10,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>Dépenses</div>
      <div class="serif" style=${{fontSize:15,fontWeight:700,color:'var(--text)',lineHeight:1.2}}>${fmtAmt(total,cur||'€')}</div>
    </div>
  </div>`;
};

const SavingsRing=({pct,color,size=72})=>{
  const R=27,circ=2*Math.PI*R,filled=Math.min(pct,100)/100*circ;
  return html`<svg style=${{transform:'rotate(-90deg)',flexShrink:0}} width=${size} height=${size} viewBox="0 0 72 72">
    <circle class="ring-bg" cx="36" cy="36" r=${R}/>
    <circle class="ring-fill" cx="36" cy="36" r=${R} stroke=${color} stroke-dasharray=${circ} stroke-dashoffset=${circ-filled} style=${{['--circ']:circ,['--end']:circ-filled}}/>
  </svg>`;
};

const CatPicker=({value,onChange,type})=>{
  const cats=CATS.filter(c=>c.t===type);
  return html`<div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:7}}>
    ${cats.map(c=>html`<button key=${c.k} onClick=${()=>onChange(c.k)} style=${{background:value===c.k?c.g:c.bg,borderRadius:13,border:`2.5px solid ${value===c.k?c.c:'transparent'}`,padding:'9px 3px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all .18s',boxShadow:value===c.k?`0 4px 14px ${c.c}44`:'none',WebkitTapHighlightColor:'transparent'}}>
      <span style=${{fontSize:20,lineHeight:1}}>${c.e}</span>
      <span style=${{fontSize:8.5,fontWeight:800,color:value===c.k?'#fff':c.c,lineHeight:1.2,textAlign:'center'}}>${c.l}</span>
    </button>`)}
  </div>`;
};

const ChatPage=({txs,savings,budgets,cur,apiKey,name})=>{
  const [msgs,setMsgs]=useState(()=>LS.get('fin-chat',[]));
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  const monthTxs=txs.filter(t=>isThisMonth(t.date));
  const income=monthTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=monthTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const topCats=Object.entries(monthTxs.filter(t=>t.type==='expense').reduce((acc,t)=>{acc[t.cat]=(acc[t.cat]||0)+t.amount;return acc},{})).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${getC(k).e}${getC(k).l}: ${v.toFixed(0)}${cur}`).join(', ');
  const totalSaved=savings.reduce((s,g)=>s+g.current,0);
  const sysPrompt=`Tu es Finella AI, une assistante financière personnelle bienveillante, chaleureuse et experte. Tu analyses les finances de ${name} et lui donnes des conseils personnalisés, pratiques, positifs et concrets. Tu parles en français, avec une touche amicale. Tu utilises des emojis. Tes réponses sont concises (3-5 lignes max).

Données financières de ${name} ce mois :
- Revenus : ${income.toFixed(2)}${cur} | Dépenses : ${expense.toFixed(2)}${cur} | Solde : ${(income-expense).toFixed(2)}${cur}
- Top dépenses : ${topCats||'aucune'}
- Épargne totale : ${totalSaved.toFixed(2)}${cur}
- Objectifs : ${savings.map(g=>`${g.emoji}${g.name}(${g.current.toFixed(0)}/${g.target.toFixed(0)}${cur})`).join(', ')||'aucun'}
- Nb transactions ce mois : ${monthTxs.length}`;

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'})},[msgs,loading]);
  useEffect(()=>{LS.set('fin-chat',msgs.slice(-40))},[msgs]);

  const send=async()=>{
    if(!input.trim()||loading)return;
    const userMsg={role:'user',content:input.trim(),id:mkId()};
    const newMsgs=[...msgs,userMsg];
    setMsgs(newMsgs);setInput('');setLoading(true);
    if(!apiKey){
      setLoading(false);
      setMsgs(m=>[...m,{role:'assistant',content:`Coucou ${name} 💖 ! Pour activer Finella AI, il me faut ta clé API Anthropic. Va dans l'onglet 👩 Profil → Clé API Anthropic. Tu peux la créer gratuitement sur console.anthropic.com 🌸`,id:mkId()}]);
      return;
    }
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-allow-any-origin':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sysPrompt,messages:newMsgs.map(m=>({role:m.role,content:m.content}))})});
      const data=await res.json();
      setMsgs(m=>[...m,{role:'assistant',content:data.content?.[0]?.text||'Désolée, une erreur est survenue. 💔',id:mkId()}]);
    }catch{
      setMsgs(m=>[...m,{role:'assistant',content:'Oups ! Erreur réseau. Vérifie ta clé API et ta connexion 💫',id:mkId()}]);
    }
    setLoading(false);
  };
  const SUGGS=['📊 Analyse mes dépenses du mois','💰 Comment épargner davantage ?','🔍 Où est-ce que je gaspille ?','✨ Conseils pour atteindre mes objectifs'];

  return html`<div style=${{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
    <div style=${{background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 6s ease infinite',padding:'calc(var(--safe-top) + 12px) 18px 16px',flexShrink:0,boxShadow:'0 4px 22px var(--rose-glow)'}}>
      <div style=${{display:'flex',alignItems:'center',gap:12}}>
        <div style=${{width:44,height:44,borderRadius:14,background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,backdropFilter:'blur(10px)'}}>💖</div>
        <div style=${{flex:1}}>
          <div style=${{fontSize:16,fontWeight:900,color:'#fff'}}>Finella AI ✨</div>
          <div style=${{fontSize:11,color:'rgba(255,255,255,.7)',fontWeight:600}}>Ton assistante financière IA</div>
        </div>
        <button onClick=${()=>setMsgs([])} style=${{background:'rgba(255,255,255,.15)',border:'none',borderRadius:10,padding:'6px 12px',color:'#fff',cursor:'pointer',fontSize:12,fontWeight:800,fontFamily:'inherit'}}>Effacer</button>
      </div>
    </div>
    <div style=${{flex:1,overflowY:'auto',padding:'16px',display:'flex',flexDirection:'column',gap:12}}>
      ${msgs.length===0&&html`<div style=${{textAlign:'center',padding:'16px 0 8px'}}>
        <div style=${{fontSize:54,marginBottom:6,animation:'float 3s ease-in-out infinite',display:'block'}}>🌸</div>
        <div style=${{fontSize:16,fontWeight:800,color:'var(--text)',marginBottom:3}}>Coucou ${name} ! 👋</div>
        <div style=${{fontSize:13,color:'var(--muted)',lineHeight:1.7,marginBottom:18,fontWeight:600}}>Je suis Finella AI, ton assistante<br/>financière personnelle !</div>
        <div style=${{display:'flex',flexDirection:'column',gap:8}}>
          ${SUGGS.map(s=>html`<button key=${s} onClick=${()=>setInput(s)} style=${{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:14,padding:'11px 14px',cursor:'pointer',fontSize:13,fontWeight:700,color:'var(--violet)',textAlign:'left',fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>${s}</button>`)}
        </div>
      </div>`}
      ${msgs.map((m,i)=>html`<div key=${m.id||i} style=${{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',alignItems:'flex-end',gap:8}}>
        ${m.role==='assistant'&&html`<div style=${{width:30,height:30,borderRadius:10,background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 5s ease infinite',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,flexShrink:0}}>💖</div>`}
        <div class=${`chat-bubble ${m.role==='assistant'?'bubble-ai':'bubble-user'}`}>${m.content}</div>
      </div>`)}
      ${loading&&html`<div style=${{display:'flex',alignItems:'flex-end',gap:8}}>
        <div style=${{width:30,height:30,borderRadius:10,background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 5s ease infinite',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,flexShrink:0}}>💖</div>
        <div class="bubble-ai" style=${{display:'flex',gap:5,alignItems:'center',padding:'14px 18px'}}>
          <div class="tdot"/><div class="tdot"/><div class="tdot"/>
        </div>
      </div>`}
      <div ref=${endRef}/>
    </div>
    <div style=${{padding:'10px 14px',paddingBottom:`calc(var(--safe-bottom) + 96px)`,background:'var(--surface)',borderTop:'1px solid var(--border)',display:'flex',gap:8,flexShrink:0}}>
      <input class="inp" value=${input} onInput=${e=>setInput(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()} placeholder="Parle à Finella…" style=${{flex:1,padding:'12px 14px',fontSize:14}}/>
      <button onClick=${send} style=${{width:46,height:46,borderRadius:13,background:loading||!input.trim()?'var(--border)':'var(--hero)',backgroundSize:'200% 200%',animation:!loading&&input.trim()?'gradShift 5s ease infinite':undefined,border:'none',color:'#fff',cursor:loading||!input.trim()?'default':'pointer',fontSize:19,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',transition:'background .2s'}}>
        ${loading?html`<div style=${{width:18,height:18,borderRadius:'50%',border:'3px solid rgba(255,255,255,.3)',borderTopColor:'#fff',animation:'spin .7s linear infinite'}}/>`:html`→`}
      </button>
    </div>
  </div>`;
};

const ProfilePage=({settings,photo,txs,savings,wishlist,onSaveSettings,onPhotoChange,onClear,navTo})=>{
  const [name,setName]=useState(settings.name);
  const [cur,setCur]=useState(settings.currency);
  const [apiKey,setApiKey]=useState(settings.apiKey||'');
  const [showKey,setShowKey]=useState(false);
  const fileRef=useRef(null);
  const monthTxs=txs.filter(t=>isThisMonth(t.date));
  const totalExpense=monthTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const totalIncome=monthTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const totalSaved=savings.reduce((s,g)=>s+g.current,0);
  const handlePhoto=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{onPhotoChange(ev.target.result);};
    reader.readAsDataURL(file);
  };
  return html`<div class="p-screen">
    <input type="file" accept="image/*" onChange=${handlePhoto} style=${{display:'none'}} ref=${fileRef}/>
    <div style=${{background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 6s ease infinite',margin:'-18px -16px 0',padding:'24px 20px 32px',position:'relative',overflow:'hidden'}}>
      <div style=${{position:'absolute',top:-40,right:-40,width:160,height:160,borderRadius:'50%',background:'rgba(255,255,255,.07)'}}/>
      <div style=${{display:'flex',flexDirection:'column',alignItems:'center',gap:12,position:'relative',zIndex:1}}>
        <div style=${{position:'relative'}}>
          <div style=${{width:90,height:90,borderRadius:'50%',border:'3px solid rgba(255,255,255,.5)',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(255,255,255,.2)',cursor:'pointer'}} onClick=${()=>fileRef.current?.click()}>
            ${photo?html`<img src=${photo} style=${{width:'100%',height:'100%',objectFit:'cover'}}/>`:html`<span style=${{fontSize:36,color:'#fff',fontWeight:900}}>${(settings.name||'?').slice(0,2).toUpperCase()}</span>`}
          </div>
          <button onClick=${()=>fileRef.current?.click()} style=${{position:'absolute',bottom:0,right:0,width:28,height:28,borderRadius:'50%',background:'#fff',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,boxShadow:'0 2px 8px rgba(0,0,0,.2)'}}>📷</button>
        </div>
        <div style=${{textAlign:'center'}}>
          <div class="serif" style=${{fontSize:24,fontWeight:700,color:'#fff',marginBottom:2}}>${settings.name}</div>
          <div style=${{fontSize:12,color:'rgba(255,255,255,.7)',fontWeight:600}}>Appuie sur la photo pour la changer</div>
        </div>
      </div>
    </div>

    <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,margin:'14px 0'}}>
      ${[{l:'Dépenses',v:fmtAmt(totalExpense,cur),c:'var(--rose)'},{l:'Revenus',v:fmtAmt(totalIncome,cur),c:'var(--mint)'},{l:'Épargne',v:fmtAmt(totalSaved,cur),c:'var(--gold)'}].map(s=>html`<div key=${s.l} class="stat-pill">
        <div style=${{fontSize:9.5,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>${s.l}</div>
        <div class="serif" style=${{fontSize:14,fontWeight:700,color:s.c,lineHeight:1.2}}>${s.v}</div>
      </div>`)}
    </div>

    <div class="card" style=${{padding:'16px 18px',marginBottom:12}}>
      <h3 style=${{fontSize:12,fontWeight:800,color:'var(--muted)',marginBottom:14,textTransform:'uppercase',letterSpacing:'.08em'}}>Mon profil</h3>
      <${FInput} label="Prénom" value=${name} onChange=${setName} placeholder="Ton prénom"/>
      <${FSelect} label="Devise" value=${cur} onChange=${setCur} options=${CURRENCIES.map(c=>({v:c.s,l:c.l}))}/>
      <button class="btn btn-rose btn-sm" style=${{width:'100%'}} onClick=${()=>onSaveSettings({name,currency:cur,apiKey})}>Enregistrer ✓</button>
    </div>

    <div class="card" style=${{padding:'16px 18px',marginBottom:12}}>
      <h3 style=${{fontSize:12,fontWeight:800,color:'var(--muted)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.08em'}}>Finella AI — Clé Anthropic</h3>
      <p style=${{fontSize:12,color:'var(--muted)',marginBottom:13,lineHeight:1.65,fontWeight:600}}>Obtiens ta clé sur <strong style=${{color:'var(--violet)'}}>console.anthropic.com</strong> → API Keys. Stockée uniquement sur cet appareil.</p>
      <div class="inp-wrap">
        <label class="lbl">Clé API</label>
        <div style=${{position:'relative'}}>
          <input class="inp" type=${showKey?'text':'password'} value=${apiKey} onInput=${e=>setApiKey(e.target.value)} placeholder="sk-ant-…"/>
          <button onClick=${()=>setShowKey(v=>!v)} style=${{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:18,lineHeight:1}}>${showKey?'🙈':'👁️'}</button>
        </div>
      </div>
      <button class="btn btn-rose btn-sm" style=${{width:'100%'}} onClick=${()=>onSaveSettings({name,currency:cur,apiKey})}>Enregistrer la clé ✓</button>
    </div>

    <div class="card" style=${{padding:'16px 18px',marginBottom:12}}>
      <h3 style=${{fontSize:12,fontWeight:800,color:'var(--muted)',marginBottom:12,textTransform:'uppercase',letterSpacing:'.08em'}}>Statistiques</h3>
      <div style=${{display:'flex',flexDirection:'column',gap:8}}>
        ${[{l:'Total transactions',v:txs.length},{l:'Objectifs d\'épargne',v:savings.length},{l:'Wishlist',v:wishlist.length},{l:'Objectifs atteints',v:savings.filter(g=>g.current>=g.target).length}].map(s=>html`<div key=${s.l} style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <span style=${{fontSize:13,fontWeight:700,color:'var(--muted)'}}>${s.l}</span>
          <span class="serif" style=${{fontSize:16,fontWeight:700,color:'var(--text)'}}>${s.v}</span>
        </div>`)}
      </div>
    </div>

    <div class="card" style=${{padding:'16px 18px'}}>
      <h3 style=${{fontSize:12,fontWeight:800,color:'#C81A5E',marginBottom:12,textTransform:'uppercase',letterSpacing:'.08em'}}>Zone danger 🚨</h3>
      <button class="btn btn-danger" style=${{width:'100%',fontSize:14}} onClick=${()=>{if(confirm('Supprimer TOUTES les données ? Action irréversible.'))onClear();}}>Réinitialiser toutes les données</button>
    </div>
    <div style=${{height:16}}/>
  </div>`;
};

function App(){
  const [settings,setSettings]=useState(()=>LS.get('fin-settings',null));
  const [txs,setTxs]=useState(()=>LS.get('fin-txs',[]));
  const [budgets,setBudgets]=useState(()=>LS.get('fin-budgets',{}));
  const [savings,setSavings]=useState(()=>LS.get('fin-savings',[]));
  const [wishlist,setWishlist]=useState(()=>LS.get('fin-wish',[]));
  const [photo,setPhoto]=useState(()=>LS.get('fin-photo',null));
  const [page,setPage]=useState('home');
  const [addOpen,setAddOpen]=useState(false);
  const [editTx,setEditTx]=useState(null);
  const [animKey,setAnimKey]=useState(0);

  const cur=settings?.currency||'€';
  window._fCur=cur;

  useEffect(()=>{LS.set('fin-txs',txs)},[txs]);
  useEffect(()=>{LS.set('fin-budgets',budgets)},[budgets]);
  useEffect(()=>{LS.set('fin-savings',savings)},[savings]);
  useEffect(()=>{LS.set('fin-wish',wishlist)},[wishlist]);
  useEffect(()=>{LS.set('fin-settings',settings)},[settings]);
  useEffect(()=>{if(photo)LS.set('fin-photo',photo)},[photo]);

  const navTo=p=>{setPage(p);setAnimKey(k=>k+1)};
  if(!settings)return html`<${Onboarding} onDone=${s=>setSettings(s)}/>`;

  const saveTx=t=>{setTxs(prev=>{const i=prev.findIndex(x=>x.id===t.id);return i>=0?prev.map(x=>x.id===t.id?t:x):[...prev,t]});setEditTx(null);};
  const delTx=id=>setTxs(prev=>prev.filter(t=>t.id!==id));
  const saveBudget=(k,v)=>setBudgets(p=>{const n={...p};if(!v)delete n[k];else n[k]=v;return n});
  const saveGoal=g=>setSavings(prev=>{const i=prev.findIndex(x=>x.id===g.id);return i>=0?prev.map(x=>x.id===g.id?g:x):[...prev,g]});
  const delGoal=id=>setSavings(prev=>prev.filter(g=>g.id!==id));
  const addContrib=(id,amt)=>setSavings(prev=>prev.map(g=>g.id===id?{...g,current:Math.min(g.current+amt,g.target)}:g));
  const saveWish=w=>setWishlist(prev=>{const i=prev.findIndex(x=>x.id===w.id);return i>=0?prev.map(x=>x.id===w.id?w:x):[...prev,w]});
  const delWish=id=>setWishlist(prev=>prev.filter(w=>w.id!==id));
  const toggleWish=id=>setWishlist(prev=>prev.map(w=>w.id===id?{...w,done:!w.done}:w));
  const clearAll=()=>{setTxs([]);setBudgets({});setSavings([]);setWishlist([]);setPhoto(null);LS.set('fin-chat',[]);};

  const NAV=[
    {id:'home',icon:'🏠',label:'Accueil'},
    {id:'txs',icon:'💳',label:'Dépenses'},
    {id:'budget',icon:'📊',label:'Budget'},
    {id:'savings',icon:'💎',label:'Épargne'},
    {id:'chat',icon:'💬',label:'Finella IA'},
  ];

  return html`<div style=${{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden',fontFamily:"'Nunito',-apple-system,sans-serif",background:'var(--bg)'}}>

    ${page!=='chat'&&page!=='profile'&&html`<div style=${{paddingTop:'var(--safe-top)',flexShrink:0,background:'var(--bg)'}}>
      <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 18px 6px'}}>
        <div class="serif" style=${{fontSize:22,fontWeight:700,color:'var(--text)',letterSpacing:'-.01em'}}>
          Finella <span style=${{background:'var(--hero)',backgroundSize:'200% 200%',animation:'gradShift 5s ease infinite',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>💖</span>
        </div>
        <${ProfileAvatar} photo=${photo} name=${settings.name} size=${38} onClick=${()=>navTo('profile')}/>
      </div>
    </div>`}

    <div class=${`screen ${page==='chat'||page==='profile'?'no-nav':''}`} style=${{flex:1}}>
      <div key=${animKey} class="fu">
        ${page==='home'&&html`<${HomePage} txs=${txs} savings=${savings} name=${settings.name} cur=${cur} photo=${photo} onAdd=${()=>setAddOpen(true)} navTo=${navTo}/>`}
        ${page==='txs'&&html`<${TxPage} txs=${txs} cur=${cur} onEdit=${t=>{setEditTx(t);setAddOpen(true);}} onDelete=${delTx}/>`}
        ${page==='budget'&&html`<${BudgetPage} txs=${txs} budgets=${budgets} cur=${cur} onSaveBudget=${saveBudget}/>`}
        ${page==='savings'&&html`<${SavingsPage} savings=${savings} cur=${cur} wishlist=${wishlist} onSaveGoal=${saveGoal} onDeleteGoal=${delGoal} onContrib=${addContrib} onSaveWish=${saveWish} onDeleteWish=${delWish} onToggleWish=${toggleWish}/>`}
        ${page==='chat'&&html`<${ChatPage} txs=${txs} savings=${savings} budgets=${budgets} cur=${cur} apiKey=${settings.apiKey} name=${settings.name}/>`}
        ${page==='profile'&&html`<${ProfilePage} settings=${settings} photo=${photo} txs=${txs} savings=${savings} wishlist=${wishlist} onSaveSettings=${s=>{setSettings(prev=>({...prev,...s}));navTo('home');}} onPhotoChange=${setPhoto} onClear=${clearAll} navTo=${navTo}/>`}
      </div>
    </div>

    <nav class="bot-nav">
      ${NAV.map(n=>html`<button key=${n.id} class=${`nav-btn ${page===n.id?'active':''}`} onClick=${()=>navTo(n.id)}>
        <span class="nicon">${n.icon}</span>
        <span class="nlabel">${n.label}</span>
      </button>`)}
      <button class=${`nav-btn ${page==='profile'?'active':''}`} onClick=${()=>navTo('profile')}>
        <span class="nicon" style=${{overflow:'hidden',borderRadius:'50%',width:24,height:24,display:'flex',alignItems:'center',justifyContent:'center'}}>
          ${photo?html`<img src=${photo} style=${{width:24,height:24,objectFit:'cover',borderRadius:'50%'}}/>`:html`<span style=${{fontSize:20}}>👩</span>`}
        </span>
        <span class="nlabel">Profil</span>
      </button>
    </nav>

    ${['home','txs','budget'].includes(page)&&html`<button class="fab" onClick=${()=>{setEditTx(null);setAddOpen(true);}}>＋</button>`}
    ${(addOpen||editTx)&&html`<${TxForm} onClose=${()=>{setAddOpen(false);setEditTx(null);}} onSave=${saveTx} initial=${editTx}/>`}
  </div>`;
}

render(html`<${App}/>`,document.getElementById('root'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
